<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexusRoute | Wavelength Global Radio (3000 Live Stations)</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#0c1420;
    --bg2:#0f1a2a;
    --surface:#13233a;
    --surface2:#182c48;
    --line:#1e3a5c;
    --ink:#dcebfa;
    --ink-dim:#8fb0cf;
    --ink-faint:#5c7d9e;
    --accent:#25d0ff;
    --accent-ink:#07131f;
    --good:#3ddc8f;
    --warn:#ffb454;
    --crit:#ff6b6b;
    --grad-a:#25d0ff;
    --grad-b:#8f6bff;
    --shadow:0 18px 50px rgba(0,0,0,.45);
    --radius:16px;
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --bg:#eef4fb;
    --bg2:#e6eef8;
    --surface:#ffffff;
    --surface2:#f2f7fd;
    --line:#d3e2f2;
    --ink:#0e2a44;
    --ink-dim:#3d5f80;
    --ink-faint:#7d9cbb;
    --accent:#0087c9;
    --accent-ink:#ffffff;
    --good:#0ea565;
    --warn:#c07a00;
    --crit:#d34545;
    --grad-a:#0087c9;
    --grad-b:#6a4fd0;
    --shadow:0 18px 50px rgba(30,60,100,.18);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    overflow:hidden;font-size:14px;
  }
  ::selection{background:var(--accent);color:var(--accent-ink)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  .app{display:grid;grid-template-rows:auto 1fr;height:100vh;background:
    radial-gradient(1200px 700px at 85% -10%, rgba(37,208,255,.10), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(143,107,255,.08), transparent 55%),
    var(--bg);}
  /* top bar */
  .bar{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);backdrop-filter:blur(6px);background:color-mix(in srgb, var(--bg) 70%, transparent)}
  .brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:16px;letter-spacing:.3px}
  .brand .dot{width:13px;height:13px;border-radius:50%;background:conic-gradient(from 120deg,var(--grad-a),var(--grad-b),var(--grad-a));box-shadow:0 0 14px rgba(37,208,255,.55)}
  .brand small{color:var(--ink-faint);font-weight:400;font-size:11px;letter-spacing:2px;text-transform:uppercase;display:block;line-height:1}
  .grow{flex:1}
  .pill{font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
  .pill .live{width:8px;height:8px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 0 rgba(255,107,107,.6);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,107,.55)}70%{box-shadow:0 0 0 8px rgba(255,107,107,0)}100%{box-shadow:0 0 0 0 rgba(255,107,107,0)}}
  .iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-dim);transition:.15s;position:relative}
  .iconbtn:hover{background:var(--surface);color:var(--ink)}
  .iconbtn svg{width:18px;height:18px}
  .iconbtn.active{color:var(--accent)}
  .iconbtn .badge{position:absolute;top:2px;right:2px;min-width:15px;height:15px;border-radius:8px;background:var(--crit);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px;line-height:1}
  /* dropdown (sleep timer / spectrum menu) */
  .relwrap{position:relative}
  .menu{position:absolute;top:calc(100% + 8px);right:0;min-width:168px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:60;display:none;flex-direction:column}
  .menu.open{display:flex}
  .menu .mi{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--ink-dim);cursor:pointer;transition:.12s;text-align:left;background:none;border:none;width:100%}
  .menu .mi:hover{background:var(--surface2);color:var(--ink)}
  .menu .mi.on{color:var(--accent);font-weight:600}
  .menu .mi .sp{flex:1}
  .menu .mi .ck{width:15px;height:15px}
  .menu .sep{height:1px;background:var(--line);margin:5px 6px}
  .menu .lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);padding:6px 10px 3px;font-weight:600}
  /* layout */
  .main{display:grid;grid-template-columns:340px 1fr;gap:0;min-height:0}
  /* sidebar */
  .side{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;background:color-mix(in srgb, var(--bg2) 60%, transparent)}
  .searchwrap{padding:16px 16px 10px}
  .search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 12px;height:40px;transition:.15s}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,208,255,.15)}
  .search svg{width:16px;height:16px;color:var(--ink-faint);flex:none}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:13.5px}
  .search input::placeholder{color:var(--ink-faint)}
  /* preset dropdowns (genre / region) */
  .presets{display:flex;gap:8px;padding:0 16px 12px}
  .pselect{flex:1;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:0 8px 0 10px;height:36px;transition:.15s;cursor:pointer;min-width:0}
  .pselect:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,208,255,.15)}
  .pselect svg{width:15px;height:15px;color:var(--ink-faint);flex:none}
  .pselect select{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;appearance:none;-webkit-appearance:none;font-family:inherit;height:100%}
  .pselect select option{background:var(--surface);color:var(--ink)}
  .filters{display:flex;gap:6px;padding:0 16px 12px;flex-wrap:wrap}
  .chip{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim);transition:.15s;background:transparent}
  .chip:hover{color:var(--ink);border-color:var(--ink-faint)}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
  .listhead{display:flex;align-items:baseline;justify-content:space-between;padding:6px 18px 8px;color:var(--ink-faint);font-size:11px;letter-spacing:1.6px;text-transform:uppercase}
  .listhead b{color:var(--ink-dim);font-weight:600}
  .listtools{display:flex;align-items:center;gap:10px}
  .favfilter{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;color:var(--ink-dim);font-size:11px;letter-spacing:0;text-transform:none;transition:.15s}
  .favfilter:hover{background:var(--surface);color:var(--ink)}
  .favfilter.on{background:color-mix(in srgb, var(--crit) 16%, transparent);color:var(--crit)}
  .favfilter svg{width:13px;height:13px}
  .list{flex:1;overflow-y:auto;padding:0 10px 14px;min-height:0}
  .list::-webkit-scrollbar{width:9px}
  .list::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;border:2px solid transparent;background-clip:content-box}
  .st{display:flex;gap:12px;align-items:center;padding:11px 10px;border-radius:12px;cursor:pointer;transition:background-color .14s,border-color .14s;border:1px solid transparent;content-visibility:auto;contain-intrinsic-size:65px}
  .st:hover{background:var(--surface)}
  .st.playing{background:linear-gradient(90deg, rgba(37,208,255,.14), rgba(37,208,255,.03));border-color:rgba(37,208,255,.35)}
  .st.playing .name{color:var(--accent)}
  .st .av{width:42px;height:42px;border-radius:10px;flex:none;background:linear-gradient(135deg,var(--surface2),var(--surface));display:grid;place-items:center;overflow:hidden;position:relative}
  .st.playing .av{background:linear-gradient(135deg,var(--grad-a),var(--grad-b))}
  .st .av img{width:100%;height:100%;object-fit:cover}
  .st .av .nolett{font-weight:700;font-size:15px;color:var(--ink-dim)}
  .st.playing .av .nolett{color:var(--accent-ink)}
  .st .meta{flex:1;min-width:0}
  .st .name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st .sub{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .st .play{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--ink-dim);opacity:0;transition:.15s}
  .st:hover .play,.st.playing .play{opacity:1}
  .st.playing .play{background:var(--accent);color:var(--accent-ink)}
  .st .play svg{width:13px;height:13px}
  .st .eq{flex:none;display:flex;gap:2px;align-items:flex-end;height:14px;opacity:0}
  .st.playing .eq{opacity:1}
  .st .eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq .9s ease-in-out infinite}
  .st .rowfav{width:14px;height:14px;flex:none;color:var(--crit);display:none}
  .st.favourite .rowfav{display:block}
  .st .eq i:nth-child(1){animation-delay:0s}.st .eq i:nth-child(2){animation-delay:.15s}.st .eq i:nth-child(3){animation-delay:.3s}.st .eq i:nth-child(4){animation-delay:.45s}
  @keyframes eq{0%,100%{height:4px}50%{height:14px}}
  .empty{text-align:center;color:var(--ink-faint);padding:40px 20px;font-size:13px;line-height:1.6}
  /* player */
  .player{display:flex;flex-direction:column;min-height:0;padding:26px 34px 22px;gap:0}
  .nowtop{display:flex;align-items:center;gap:22px}
  .art{position:relative;width:118px;height:118px;flex:none;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--surface2),var(--surface));box-shadow:var(--shadow)}
  .art img{width:100%;height:100%;object-fit:cover}
  .art .vinyl{position:absolute;inset:0;display:grid;place-items:center}
  .art .vinyl .ring{width:52px;height:52px;border-radius:50%;background:conic-gradient(from 0deg,var(--grad-a),var(--grad-b),var(--grad-a));position:relative}
  .art .vinyl .ring::after{content:"";position:absolute;inset:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--bg)}
  .nowmeta{flex:1;min-width:0}
  .kicker{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--accent);font-weight:600}
  .nowmeta h1{margin:6px 0 4px;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nowmeta .prog{margin:0;color:var(--ink-dim);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nowmeta .loc{display:flex;gap:16px;margin-top:10px;color:var(--ink-faint);font-size:12.5px;flex-wrap:wrap}
  .nowmeta .loc span{display:flex;align-items:center;gap:6px}
  .nowmeta .loc svg{width:14px;height:14px;opacity:.7}
  /* transport */
  .transport{display:flex;align-items:center;gap:20px;margin:22px 0 0}
  .big{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff;box-shadow:0 10px 26px rgba(37,208,255,.4);transition:transform .14s,box-shadow .14s}
  .big:hover{transform:scale(1.05);box-shadow:0 12px 30px rgba(37,208,255,.5)}
  .big:active{transform:scale(.97)}
  .big svg{width:26px;height:26px}
  .big.paused{background:var(--surface2);color:var(--ink);box-shadow:none}
  .transbtns{display:flex;gap:6px}
  .tbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-dim);transition:.15s}
  .tbtn:hover{background:var(--surface);color:var(--ink)}
  .tbtn.active{background:color-mix(in srgb, var(--crit) 16%, transparent);color:var(--crit)}
  .tbtn svg{width:21px;height:21px}
  .tbtn.volwrap{width:auto;padding:0 10px;gap:0}
  /* volume */
  .vol{display:flex;align-items:center;gap:10px}
  .vol svg{width:20px;height:20px;color:var(--ink-dim);flex:none}
  .vol input{width:110px;accent-color:var(--accent)}
  /* now-playing metadata line */
  .nowmeta .track{margin:6px 0 0;color:var(--ink);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
  .nowmeta .track.show{display:block;animation:fadein .3s ease}
  .nowmeta .track .eqmini{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-right:8px;vertical-align:middle}
  .nowmeta .track .eqmini i{width:2.5px;background:var(--good);border-radius:2px;animation:eq .8s ease-in-out infinite}
  .nowmeta .track .eqmini i:nth-child(2){animation-delay:.12s}.nowmeta .track .eqmini i:nth-child(3){animation-delay:.24s}.nowmeta .track .eqmini i:nth-child(4){animation-delay:.36s}
  @keyframes fadein{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  /* status */
  .statusbar{display:flex;align-items:center;gap:18px;padding:14px 34px 16px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:12px;font-variant-numeric:tabular-nums;background:color-mix(in srgb, var(--bg2) 60%, transparent)}
  .statusbar .stream{display:flex;align-items:center;gap:8px}
  .statusbar .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:none}
  .statusbar .dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
  .statusbar .dot.connecting{background:var(--warn);animation:pulse 1s infinite}
  .statusbar .dot.err{background:var(--crit)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:80vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--crit)}
  .toast.err b{color:var(--crit)}
  @media (max-width:860px){
    .main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .side{border-right:none;border-bottom:1px solid var(--line);max-height:38vh}
    .nowmeta h1{font-size:22px}
    .art{width:88px;height:88px}
  }
</style>
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <span class="dot"></span>
        <div>Wavelength<small>Global Radio</small></div>
      </div>
      <div class="grow"></div>
      <div class="pill"><span class="live"></span> Live internet radio</div>
      <div class="relwrap">
      <button class="iconbtn" id="sleepBtn" title="Sleep timer" aria-label="Sleep timer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span class="badge" id="sleepBadge" hidden></span>
      </button>
      <div class="menu" id="sleepMenu">
        <div class="lbl">Sleep timer</div>
        <button class="mi" data-min="0" type="button"><span>Off</span><span class="sp"></span><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg></button>
        <button class="mi" data-min="15" type="button">15 minutes</button>
        <button class="mi" data-min="30" type="button">30 minutes</button>
        <button class="mi" data-min="60" type="button">1 hour</button>
        <button class="mi" data-min="90" type="button">90 minutes</button>
      </div>
      </div>
      <button class="iconbtn" id="fsBtn" title="Fullscreen (F11)" aria-label="Toggle fullscreen">
        <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
      </button>
      <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <div class="main">
      <aside class="side">
        <div class="searchwrap">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="q" type="text" placeholder="Search stations, genres, countries…" autocomplete="off">
          </div>
        </div>
        <div class="presets">
          <label class="pselect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10h-4a6 6 0 0 0-6-6z"/></svg>
            <select id="genreSel" aria-label="Genre"></select>
          </label>
          <label class="pselect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.3-7-11a7 7 0 0 1 14 0c0 5.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <select id="regionSel" aria-label="Region"></select>
          </label>
        </div>
        <div class="listhead"><span>Stations</span><div class="listtools"><button class="favfilter" id="favFilter" type="button" aria-pressed="false" title="Show favourites only"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg><span id="favCount">0 favourites</span></button><b id="count"></b></div></div>
        <div class="list" id="list"></div>
      </aside>

      <section class="player">
        <div class="nowtop">
          <div class="art" id="art">
            <img id="artImg" alt="" hidden>
            <div class="vinyl" id="artVinyl"><div class="ring"></div></div>
          </div>
          <div class="nowmeta">
            <div class="kicker" id="kicker">Select a station</div>
            <h1 id="nowName">Wavelength</h1>
            <p class="prog" id="nowProg">Tune in to English-speaking radio from anywhere on Earth.</p>
            <div class="track" id="nowTrack"><span class="eqmini"><i></i><i></i><i></i><i></i></span><span id="nowTrackText"></span></div>
            <div class="loc">
              <span id="nowCountry"></span>
              <span id="nowBit"></span>
              <span id="nowTags"></span>
            </div>
          </div>
        </div>

        <div class="transport">
          <button class="big paused" id="playBtn" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="transbtns">
            <button class="tbtn" id="shuffleBtn" title="Shuffle" aria-label="Shuffle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
            </button>
            <button class="tbtn" id="favBtn" title="Add to favourites" aria-label="Favourite">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
            </button>
          </div>
          <div class="grow"></div>
          <div class="vol">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
            <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
          </div>
        </div>

      </section>
    </div>

    <div class="statusbar">
      <span class="stream"><span class="dot" id="statusDot"></span><span id="statusText">Idle</span></span>
      <span id="statusExtra"></span>
      <div class="grow"></div>
      <span id="clock"></span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ---------- tiny radio-browser client ----------
const API = "https://de1.api.radio-browser.info";
let db = [];            // full station list
let filtered = [];      // after search+genre+region
let genre = "All";
let region = "All";
let favOnly = false;
let favs = new Set();
try{ favs = new Set(JSON.parse(localStorage.getItem("wl_favs")||"[]")); }catch(e){}
let audio = new Audio();
let current = null;
let playing = false;
let connecting = false;
let vol = 0.8;
let clockTimer = null;
let sleepMinutes = 0;           // 0 = off
let sleepEndsAt = 0;            // epoch ms when timer fires
let sleepTimer = null, sleepTick = null;
// ICECAST metadata
let metaTimer = null;
let metaAbort = null;

const $ = s=>document.querySelector(s);
const genreChips = ["All","Rock","Pop","Jazz","Classical","News","Talk","Dance","Hip-Hop","Country","Electronic","80s","90s","Ambient","Folk","Blues","Indie","Latin","Reggae","Metal","Religious","Oldies"];
const regionChips = [
  {label:"All", key:""},
  {label:"United Kingdom", key:["united kingdom","britain"]},
  {label:"United States", key:["united states","america"]},
  {label:"Canada", key:["canada"]},
  {label:"Australia", key:["australia"]},
  {label:"Ireland", key:["ireland"]},
  {label:"New Zealand", key:["new zealand"]},
  {label:"South Africa", key:["south africa"]}
];
function regionMatches(s){
  if(region==="All") return true;
  const c=(s.country||"").toLowerCase();
  const chip=regionChips.find(r=>r.label===region);
  if(!chip) return true;
  return chip.key.some(k=>c.includes(k));
}

// Persistent cache: load instantly from localStorage, fetch fresh in background if stale (>24h).
const CACHE_KEY="wl_stations_cache";
const CACHE_MAX_AGE=24*60*60*1000; // 24 hours

async function loadStations(){
  const cached=loadCache();
  if(cached){
    db=cached.stations;
    sortDb();
    setStatus("ready","Cached · "+db.length+" stations");
    $("#count").textContent = db.length+" stations";
    // Check if stale and refresh in background
    if(Date.now()-cached.timestamp > CACHE_MAX_AGE){
      fetchStations(true); // background refresh
    }
  } else {
    await fetchStations(false); // blocking initial fetch
  }
}

function loadCache(){
  try{
    const raw=localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const parsed=JSON.parse(raw);
    if(!parsed.stations || !parsed.timestamp) return null;
    return parsed;
  }catch(e){ return null; }
}

function saveCache(stations){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({stations, timestamp:Date.now()}));
  }catch(e){ /* quota exceeded — ignore */ }
}

async function fetchStations(background){
  if(!background) setStatus("connecting","Contacting radio-browser…");
  try{
    const [topRes, broadRes, moreRes] = await Promise.all([
      fetch(`${API}/json/stations/search?limit=1500&hidebroken=true&order=votes&reverse=true&is_https=true&language=english`, {signal:AbortSignal.timeout(20000)}),
      fetch(`${API}/json/stations/search?limit=1500&hidebroken=true&order=clickcount&reverse=true&is_https=true&language=english`, {signal:AbortSignal.timeout(20000)}),
      fetch(`${API}/json/stations/search?limit=1500&hidebroken=true&order=bitrate&reverse=true&is_https=true&language=english`, {signal:AbortSignal.timeout(20000)})
    ]);
    if(!topRes.ok || !broadRes.ok || !moreRes.ok) throw new Error("HTTP");
    const rows = [...await topRes.json(), ...await broadRes.json(), ...await moreRes.json()];
    const fresh = rows.filter(s=>s&&s.name&&s.name.toLowerCase()!=="null"&&(s.url_resolved||s.url)).map(s=>({
      id:s.stationuuid, name:s.name, url:s.url_resolved||s.url,
      country:s.country||"", tags:(s.tags||"").split(",").map(t=>t.trim()).filter(Boolean).slice(0,4),
      bitrate:s.bitrate||0, codec:s.codec||"", votes:s.votes||0, favicon:s.favicon||"",
      lang:s.language||""
    }));
    // dedupe by name, keep higher-voted
    const seen=new Map();
    fresh.forEach(s=>{ if(!seen.has(s.name.toLowerCase()) || seen.get(s.name.toLowerCase()).votes<s.votes) seen.set(s.name.toLowerCase(),s); });
    const deduped=[...seen.values()];
    saveCache(deduped);
    db=deduped;
    sortDb();
    setStatus("ready","Connected · "+db.length+" stations");
    $("#count").textContent = db.length+" stations";
    if(background){
      buildList(); // refresh the list with new data
      toast("Station list updated · "+db.length+" stations");
    }
  }catch(e){
    if(!background){
      db=fallbackStations();
      setStatus("err","Offline demo · "+db.length+" cached stations");
      $("#count").textContent = db.length+" stations";
      toast("Couldn't reach the radio directory — showing cached stations.","err");
    }
    // if background fetch fails, silently keep the cached data
  }
}

function sortDb(){
  db.sort((a,b)=>(favs.has(b.id)?1:0)-(favs.has(a.id)?1:0) || (b.votes-a.votes));
}

function buildFilters(){
  const sel=$("#genreSel"); sel.innerHTML="";
  genreChips.forEach(g=>{
    const o=document.createElement("option");
    o.value=g; o.textContent=g;
    sel.appendChild(o);
  });
  sel.value=genre;
}

function buildRegions(){
  const sel=$("#regionSel"); sel.innerHTML="";
  regionChips.forEach(g=>{
    const o=document.createElement("option");
    o.value=g.label; o.textContent=g.label;
    sel.appendChild(o);
  });
  sel.value=region;
}

function matches(s){
  const q=$("#q").value.trim().toLowerCase();
  if(q && !(s.name+" "+(s.tags.join(" "))+" "+s.country).toLowerCase().includes(q)) return false;
  if(genre!=="All" && !(s.tags.some(t=>t.toLowerCase()===genre.toLowerCase()))) return false;
  if(!regionMatches(s)) return false;
  return true;
}

function buildList(){
  const q=$("#q").value.trim().toLowerCase();
  filtered = db.filter(s=>{
    if(q && !(s.name+" "+(s.tags.join(" "))+" "+s.country).toLowerCase().includes(q)) return false;
    if(genre!=="All" && !s.tags.some(t=>t.toLowerCase()===genre.toLowerCase())) return false;
    if(!regionMatches(s)) return false;
    if(favOnly && !favs.has(s.id)) return false;
    return true;
  });
  const list=$("#list"); list.innerHTML="";
  updateFavouriteUI();
  $("#count").textContent = filtered.length+" station"+(filtered.length===1?"":"s");
  if(!filtered.length){
    list.innerHTML='<div class="empty">No stations match.<br>Try a different search or genre.</div>';
    return;
  }
  // Keep the DOM small: render only what the user is close to seeing.
  const BATCH=80;
  const INITIAL=160;
  let i=0;
  const renderBatch=()=>{
    const end=Math.min(i+BATCH, filtered.length);
    const frag=document.createDocumentFragment();
    for(;i<end;i++) frag.appendChild(stationEl(filtered[i], current&&current.id===filtered[i].id));
    list.appendChild(frag);
    list.dataset.rendered=String(i);
  };
  renderBatch();
  if(i<Math.min(INITIAL,filtered.length)) renderBatch();
  if(current) $("#nowName").textContent=current.name;
}

function renderMoreStations(){
  const list=$("#list");
  let i=Number(list.dataset.rendered||0);
  if(i>=filtered.length) return;
  const frag=document.createDocumentFragment();
  const end=Math.min(i+80,filtered.length);
  for(;i<end;i++) frag.appendChild(stationEl(filtered[i],current&&current.id===filtered[i].id));
  list.appendChild(frag);
  list.dataset.rendered=String(i);
}

// Move the .playing highlight + play/pause glyph to the row for `current`
// without rebuilding the whole list (cheap when switching channels).
function updateListHighlight(){
  const rows=[...document.querySelectorAll("#list .st")];
  for(const row of rows){
    const isCur=current && row.dataset.id===current.id;
    row.classList.toggle("playing", !!isCur);
    const p=row.querySelector(".play");
    if(p) p.innerHTML=isCur
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  }
}

function stationEl(s, active){
  const el=document.createElement("div");
  el.className="st"+(active?" playing":"")+(favs.has(s.id)?" favourite":"");
  el.dataset.id=s.id;
  const initials=(s.name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  const avDiv=document.createElement("div");
  avDiv.className="av";
  if(s.favicon&&s.favicon.startsWith("http")){
    const img=document.createElement("img");
    img.src=s.favicon;
    img.loading="lazy";
    img.decoding="async";
    img.alt="";
    img.onerror=()=>{ img.remove(); tryFallbackIcon(s, avDiv, initials); };
    avDiv.appendChild(img);
  } else {
    const lett=document.createElement("span");
    lett.className="nolett";
    lett.textContent=initials;
    avDiv.appendChild(lett);
    tryFallbackIcon(s, avDiv, initials);
  }
  el.appendChild(avDiv);
  const meta=document.createElement("div");
  meta.className="meta";
  const name=document.createElement("div");
  name.className="name";
  name.textContent=s.name;
  meta.appendChild(name);
  const sub=document.createElement("div");
  sub.className="sub";
  const bits=[s.country, s.bitrate?s.bitrate+" kbps":"", s.tags.slice(0,2).join(" · ")].filter(Boolean).join("  ·  ");
  sub.textContent=bits;
  meta.appendChild(sub);
  el.appendChild(meta);
  const rowFav=document.createElementNS("http://www.w3.org/2000/svg","svg");
  rowFav.setAttribute("class","rowfav");
  rowFav.setAttribute("viewBox","0 0 24 24");
  rowFav.setAttribute("fill","currentColor");
  rowFav.setAttribute("aria-label","Favourite");
  rowFav.innerHTML='<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/>';
  el.appendChild(rowFav);
  const eq=document.createElement("span");
  eq.className="eq";
  eq.innerHTML="<i></i><i></i><i></i><i></i>";
  el.appendChild(eq);
  const p=document.createElement("button");
  p.className="play";
  p.setAttribute("aria-label","Play");
  p.innerHTML=active?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  el.appendChild(p);
  el.onclick=()=>{ if(current&&current.id===s.id&&playing){pause();} else play(s); };
  return el;
}

function tryFallbackIcon(s, avDiv, initials){
  // Try to find a favicon when the station didn't provide one
  // Extract domain hints from station name (e.g., "Exclusively" → exclusively.com)
  const name=s.name.toLowerCase();
  let domain=null;
  if(name.includes("exclusively")) domain="exclusively.com";
  else if(name.includes("bbc")) domain="bbc.co.uk";
  else if(name.includes("npr")) domain="npr.org";
  else if(name.includes("kexp")) domain="kexp.org";
  else if(name.includes("wnyc")) domain="wnyc.org";
  else if(name.includes("absolute")) domain="absoluteradio.co.uk";
  if(!domain) return;
  const img=document.createElement("img");
  img.src=`https://icons.duckduckgo.com/ip3/${domain}.ico`;
  img.alt="";
  img.loading="lazy";
  img.decoding="async";
  img.style.display="none";
  img.onload=()=>{
    const lett=avDiv.querySelector(".nolett");
    if(lett) lett.remove();
    img.style.display="";
  };
  img.onerror=()=>img.remove();
  avDiv.appendChild(img);
}

// ---------- playback ----------
function play(s){
  current=s;
  connecting=true; playing=false;
  hideTrack();
  stopMeta();
  updateListHighlight();   // highlight the newly selected row immediately
  setStatus("connecting","Connecting · "+s.name);
  renderNow();
  try{ audio.src=s.url; audio.play().catch(()=>{}); }catch(e){}
  // optimistic: mark playing once data flows
  audio.onplaying=()=>{
    connecting=false; playing=true;
    setStatus("ready","Streaming · "+s.name); renderNow(); startMeta();
  };
  audio.onwaiting=()=>{ setStatus("connecting","Buffering…"); };
  audio.onerror=()=>{ connecting=false; setStatus("err","Stream unavailable"); toast("That station couldn't be reached. Try another.","err"); };
  audio.onended=()=>{ toast("Stream ended — trying next…"); next(); };
}

function pause(){
  playing=false; audio.pause(); setStatus("ready","Paused · "+current.name);
  renderNow(); stopMeta();
}

function toggle(){
  if(!current){ if(filtered.length){play(filtered[0]);} else toast("No station selected."); return; }
  playing?pause():play(current);
}

function next(){
  if(!filtered.length) return;
  const i=filtered.findIndex(s=>current&&s.id===current.id);
  play(filtered[(i+1)%filtered.length]);
}

function shuffle(){
  if(!filtered.length) return;
  const i=filtered.findIndex(s=>current&&s.id===current.id);
  let j; do{ j=Math.floor(Math.random()*filtered.length);}while(j===i&&filtered.length>1);
  play(filtered[j]);
  toast("Shuffling to "+filtered[j].name);
}

function toggleFav(){
  if(!current){ toast("Select a station first."); return; }
  if(favs.has(current.id)){ favs.delete(current.id); toast("Removed from favourites"); }
  else{ favs.add(current.id); toast("Added to favourites"); }
  localStorage.setItem("wl_favs",JSON.stringify([...favs]));
  updateFavouriteUI();
  const row=document.querySelector(`#list .st[data-id="${CSS.escape(current.id)}"]`);
  if(row) row.classList.toggle("favourite",favs.has(current.id));
  if(favOnly) buildList();
}

function updateFavouriteUI(){
  const active=!!current&&favs.has(current.id);
  const btn=$("#favBtn");
  btn.classList.toggle("active",active);
  btn.title=active?"Remove from favourites":"Add to favourites";
  btn.setAttribute("aria-pressed",String(active));
  const heart=btn.querySelector("svg");
  if(heart) heart.setAttribute("fill",active?"currentColor":"none");
  $("#favCount").textContent=favs.size+" favourite"+(favs.size===1?"":"s");
  const filter=$("#favFilter");
  filter.classList.toggle("on",favOnly);
  filter.setAttribute("aria-pressed",String(favOnly));
}

// ---------- now playing ----------
function renderNow(){
  if(!current){ return; }
  updateFavouriteUI();
  $("#kicker").textContent = (playing?"Now playing":"Tuned to")+" · "+(current.country||"Worldwide");
  $("#nowName").textContent = current.name;
  $("#nowProg").textContent = current.tags.length? current.tags.join("  ·  ") : (current.codec||"")+" "+(current.bitrate||"")+"kbps";
  const artImg=$("#artImg");
  if(current.favicon&&current.favicon.startsWith("http")){
    artImg.src=current.favicon;
    artImg.hidden=false;
    $("#artVinyl").style.display="none";
    artImg.onerror=()=>{ artImg.hidden=true; $("#artVinyl").style.display="grid"; tryNowPlayingFallback(current); };
  } else {
    artImg.src="";
    artImg.hidden=true;
    $("#artVinyl").style.display="grid";
    tryNowPlayingFallback(current);
  }
  $("#nowCountry").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.3-7-11a7 7 0 0 1 14 0c0 5.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>`+(current.country||"Worldwide");
  $("#nowBit").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10h-4a6 6 0 0 0-6-6z"/></svg>`+(current.bitrate?current.bitrate+" kbps":"Live");
  $("#nowTags").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.4 12 22l-8.6-8.6A5 5 0 0 1 12 6.4a5 5 0 0 1 8.6 7z"/></svg>`+(current.tags[0]||"Stream");
}

function tryNowPlayingFallback(s){
  const name=s.name.toLowerCase();
  let domain=null;
  if(name.includes("exclusively")) domain="exclusively.com";
  else if(name.includes("bbc")) domain="bbc.co.uk";
  else if(name.includes("npr")) domain="npr.org";
  else if(name.includes("kexp")) domain="kexp.org";
  else if(name.includes("wnyc")) domain="wnyc.org";
  else if(name.includes("absolute")) domain="absoluteradio.co.uk";
  else if(s.url){
    try{ const u=new URL(s.url); domain=u.hostname; }catch(e){}
  }
  if(!domain) return;
  const artImg=$("#artImg");
  artImg.src=`https://icons.duckduckgo.com/ip3/${domain}.ico`;
  artImg.onload=()=>{ artImg.hidden=false; $("#artVinyl").style.display="none"; };
  artImg.onerror=()=>{ artImg.hidden=true; $("#artVinyl").style.display="grid"; };
}

// ---------- ICECAST now-playing metadata ----------
function hideTrack(){ const t=$("#nowTrack"); t.classList.remove("show"); $("#nowTrackText").textContent=""; }
function showTrack(text){
  const t=$("#nowTrack");
  if(!text){ hideTrack(); return; }
  $("#nowTrackText").textContent=text;
  t.classList.add("show");
}
function stopMeta(){ if(metaTimer){clearInterval(metaTimer);metaTimer=null;} if(metaAbort)metaAbort.abort(); }
function startMeta(){
  stopMeta();
  if(!current) return;
  const poll=()=>{ pollMetadata(current); };
  poll();
  metaTimer=setInterval(poll,15000);
}
// Reads ICECAST/SHOUTcast "icy-metaint" metadata by fetching a few bytes past the
// first metadata block and parsing the StreamTitle. Silently no-ops on streams
// without metadata or when CORS blocks the request.
async function pollMetadata(st){
  if(!st || !st.url || !playing) return;
  try{
    metaAbort=new AbortController();
    const controller=metaAbort;
    const res=await fetch(st.url,{signal:controller.signal,headers:{'Icy-MetaData':'1'}});
    if(!res.ok || !res.body) return;
    const reader=res.body.getReader();
    const first=await reader.read().catch(()=>null);
    if(!first || !first.value) return;
    // parse icy-metaint from headers
    const metaint=parseInt(res.headers.get('icy-metaint')||'',10);
    let title=null;
    if(metaint>0 && first.value.length>metaint){
      const len=first.value[metaint]*16;
      if(len>0){
        const block=first.value.slice(metaint+1,metaint+1+len);
        const str=new TextDecoder('latin1').decode(block);
        const m=str.match(/StreamTitle='([^']*)'/);
        if(m && m[1] && m[1].trim() && !/^\s*$/.test(m[1])) title=m[1].trim();
      }
    }
    try{controller.abort();}catch{}
    if(title && title.toLowerCase()!=="undefined") showTrack(title);
    // else leave any existing title; no error surface
  }catch(e){ /* CORS / network — ignore, we simply show no metadata */ }
}


// ---------- sleep timer ----------
function persistSleep(){ localStorage.setItem("wl_sleep", JSON.stringify({min:sleepMinutes, endsAt:sleepEndsAt})); }
function restoreSleepTimer(){
  try{
    const raw=JSON.parse(localStorage.getItem("wl_sleep")||"null");
    if(raw && raw.endsAt && raw.endsAt>Date.now()){ sleepMinutes=raw.min||0; sleepEndsAt=raw.endsAt; armSleepCountdown(); }
  }catch(e){}
}
function setSleep(min){
  stopSleep();
  sleepMinutes=min;
  if(min>0){ sleepEndsAt=Date.now()+min*60000; armSleepCountdown(); }
  else sleepEndsAt=0;
  persistSleep();
  renderSleepMenu();
  updateSleepBadge();
  if(min>0) toast("Sleep timer set · radio stops in "+minsLabel(min)+".");
}
function minsLabel(min){ return min>=60 ? (min/60)+" h" : min+" min"; }
function armSleepCountdown(){
  clearInterval(sleepTick);
  sleepTick=setInterval(()=>{
    const left=sleepEndsAt-Date.now();
    updateSleepBadge();
    if(left<=0){ fireSleep(); }
  },1000);
}
function stopSleep(){ clearInterval(sleepTick); sleepTick=null; }
function fireSleep(){
  stopSleep(); sleepEndsAt=0; sleepMinutes=0; persistSleep();
  renderSleepMenu(); updateSleepBadge();
  if(playing) pause();
  toast("Sleep timer — radio paused for the night. Good night. ☾");
}
function updateSleepBadge(){
  const b=$("#sleepBadge");
  if(sleepEndsAt>Date.now()){
    b.hidden=false;
    const mins=Math.max(1,Math.ceil((sleepEndsAt-Date.now())/60000));
    b.textContent=mins;
    $("#sleepBtn").classList.add("active");
  } else {
    b.hidden=true; $("#sleepBtn").classList.remove("active");
  }
}
function renderSleepMenu(){
  document.querySelectorAll("#sleepMenu .mi").forEach(mi=>{
    const m=parseInt(mi.dataset.min,10);
    mi.classList.toggle("on", sleepMinutes===m);
    const ck=mi.querySelector(".ck");
    if(ck) ck.style.opacity = sleepMinutes===m ? "1" : "0";
  });
}

// ---------- status / misc ----------
function setStatus(state,text){
  const d=$("#statusDot");
  d.className="dot";
  if(state==="ready") d.classList.add("on");
  if(state==="connecting") d.classList.add("connecting");
  if(state==="err") d.classList.add("err");
  $("#statusText").textContent=text;
}
let toastTimer;
function toast(msg,kind){
  const t=$("#toast");
  t.innerHTML= kind==="err"?("<b>Unable to play</b> — "+msg):msg;
  t.className="toast show"+(kind==="err"?" err":"");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.className="toast",3200);
}
function startClock(){
  const tick=()=>{$("#clock").textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};
  tick(); clockTimer=setInterval(tick,10000);
}

// ---------- events ----------
function wireEvents(){
  $("#q").addEventListener("input",buildList);
  $("#genreSel").addEventListener("change",e=>{ genre=e.target.value; buildList(); });
  $("#regionSel").addEventListener("change",e=>{ region=e.target.value; buildList(); });
  $("#playBtn").addEventListener("click",toggle);
  $("#shuffleBtn").addEventListener("click",shuffle);
  $("#favBtn").addEventListener("click",toggleFav);
  $("#favFilter").addEventListener("click",()=>{ favOnly=!favOnly; buildList(); });
  $("#list").addEventListener("scroll",e=>{
    const list=e.currentTarget;
    if(list.scrollTop+list.clientHeight>=list.scrollHeight-500) renderMoreStations();
  },{passive:true});
  $("#vol").addEventListener("input",e=>{ vol=+e.target.value; audio.volume=vol; });
  document.addEventListener("keydown",e=>{
    if(e.code==="Space"&&e.target.tagName!=="INPUT"){e.preventDefault();toggle();}
    if(e.code==="ArrowRight")next();
    if(e.code==="ArrowLeft"){/* prev */const i=filtered.findIndex(s=>current&&s.id===current.id);if(i>0)play(filtered[i-1]);}
  });
  // sleep timer menu
  const sb=$("#sleepBtn"), sm=$("#sleepMenu");
  sb.addEventListener("click",e=>{ e.stopPropagation(); sm.classList.toggle("open"); });
  sm.querySelectorAll(".mi").forEach(mi=>{
    mi.addEventListener("click",e=>{ e.stopPropagation(); setSleep(parseInt(mi.dataset.min,10)); sm.classList.remove("open"); });
  });
  document.addEventListener("click",()=>{ sm.classList.remove("open"); });
  renderSleepMenu(); updateSleepBadge();
  const tb=$("#themeBtn");
  tb.addEventListener("click",()=>{
    const r=document.documentElement;
    const cur=r.getAttribute("data-theme");
    r.setAttribute("data-theme", cur==="light"?"dark":"light");
    $("#themeIcon").innerHTML = cur==="light"
      ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  });
  // fullscreen toggle (browser). In the .exe, F11 is handled in Python.
  const fsBtn=$("#fsBtn");
  function updateFsIcon(){
    const fs=document.fullscreenElement;
    $("#fsIcon").innerHTML = fs
      ? '<path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>'
      : '<path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>';
  }
  fsBtn.addEventListener("click",()=>{
    if(!document.fullscreenElement){
      (document.documentElement.requestFullscreen?.()||Promise.reject()).catch(()=>toast("Fullscreen isn't available here.","err"));
    } else {
      document.exitFullscreen?.().catch(()=>{});
    }
  });
  document.addEventListener("fullscreenchange",updateFsIcon);
  updateFsIcon();
  document.addEventListener("keydown",e=>{
    if(e.key==="F11"){ if(document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(()=>{}); }
  });
}

// audio state -> play icon
setInterval(()=>{
  const icon=$("#playIcon"), btn=$("#playBtn");
  if(playing){ icon.innerHTML='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'; btn.classList.remove("paused"); }
  else{ icon.innerHTML='<path d="M8 5v14l11-7z"/>'; btn.classList.add("paused"); }
},150);

// ---------- init ----------
// Start only after constants and function definitions above have been initialized.
(async function init(){
  audio.volume=vol;
  buildFilters();
  buildRegions();
  wireEvents();
  startClock();
  restoreSleepTimer();
  await loadStations();
  buildList();
})();

// ---------- NexusRoute Bridge ----------
function notifyNexusParent() {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'nexus_radio_state',
        playing: !!playing,
        stationName: current ? current.name : null,
        country: current ? current.country : null,
        tags: current && Array.isArray(current.tags) ? current.tags : [],
        bitrate: current ? current.bitrate : 0,
        trackText: $("#nowTrackText") ? $("#nowTrackText").textContent.trim() : '',
        volume: vol
      }, '*');
    }
  } catch (e) {}
}

window.addEventListener('message', (e) => {
  if (!e.data || typeof e.data !== 'object') return;
  if (e.data.type === 'nexus_radio_cmd') {
    if (e.data.action === 'toggle') toggle();
    else if (e.data.action === 'play') { if (!playing) toggle(); }
    else if (e.data.action === 'pause') { if (playing) toggle(); }
    else if (e.data.action === 'next') next();
    else if (e.data.action === 'shuffle') shuffle();
    else if (e.data.action === 'setVolume' && typeof e.data.value === 'number') {
      vol = Math.max(0, Math.min(1, e.data.value));
      audio.volume = vol;
      const vEl = $("#vol");
      if (vEl) vEl.value = vol;
      notifyNexusParent();
    }
    else if (e.data.action === 'tuneGenre' && typeof e.data.genre === 'string') {
      const g = e.data.genre.trim();
      const match = genreChips.find(c => c.toLowerCase() === g.toLowerCase());
      if (match) {
        genre = match;
        const gSel = $("#genreSel");
        if (gSel) gSel.value = genre;
        buildList();
        if (filtered.length) play(filtered[0]);
      }
    }
    else if (e.data.action === 'tuneStation' && typeof e.data.query === 'string') {
      const qInput = $("#q");
      if (qInput) {
        qInput.value = e.data.query;
        buildList();
        if (filtered.length) play(filtered[0]);
      }
    }
    else if (e.data.action === 'getState') {
      notifyNexusParent();
    }
  }
});

const _origRenderNow = renderNow;
renderNow = function() {
  _origRenderNow();
  notifyNexusParent();
};
const _origShowTrack = showTrack;
showTrack = function(text) {
  _origShowTrack(text);
  notifyNexusParent();
};
const _origHideTrack = hideTrack;
hideTrack = function() {
  _origHideTrack();
  notifyNexusParent();
};
const _origSetStatus = setStatus;
setStatus = function(state, text) {
  _origSetStatus(state, text);
  notifyNexusParent();
};
</script>
