<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vector Dogfight 3D · Neon Valkyrie</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, Consolas, monospace; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #010704; color: #7dffae; }
    main { position: fixed; inset: 0; display: grid; place-items: center; background:
      radial-gradient(circle at 50% 42%, rgba(23,255,123,.16), transparent 34%), #010704; }
    .boot { width: min(580px, 88vw); padding: 30px; border: 1px solid #46ff91; box-shadow: 0 0 28px #15ff7044; }
    h1 { margin: 0 0 12px; font-size: clamp(20px, 4vw, 34px); letter-spacing: .16em; }
    p { margin: 8px 0; color: #a8ffca; line-height: 1.6; }
    a { color: #fff; }
    .bar { height: 4px; margin-top: 22px; background: #0c4027; overflow: hidden; }
    .bar::after { content: ''; display: block; width: 42%; height: 100%; background: #66ffa1; animation: load .7s infinite alternate ease-in-out; }
    @keyframes load { to { transform: translateX(140%); } }
  </style>
</head>
<body>
  <main>
    <section class="boot" aria-live="polite">
      <h1>VECTOR DOGFIGHT 3D</h1>
      <p>Loading the complete Neon Valkyrie flight simulator…</p>
      <p>If launch does not continue, <a id="manual" href="projects/dogfight_3d/dogfight_3d.html">open the game here</a>.</p>
      <div class="bar"></div>
    </section>
  </main>
  <script>
    const gamePath = new URL('projects/dogfight_3d/dogfight_3d.html', window.location.href);
    document.querySelector('#manual').href = gamePath.href;
    window.setTimeout(() => window.location.replace(gamePath.href), 120);
  </script>
</body>
</html>
