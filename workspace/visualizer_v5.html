<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS // AUDIO-REACTIVE 3D VISUALIZER v5.0</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#040508; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color:#cfd6e6; }
  #c { position:fixed; inset:0; display:block; z-index:1; }
  a, button { font-family:inherit; }

  /* ---------- Fullscreen / Canvas FX Overlays ---------- */
  #fxCanvas { position:fixed; inset:0; pointer-events:none; z-index:2; display:none; }

  /* ---------- Strobe Flash Overlay ---------- */
  #strobeFlash {
    position:fixed; inset:0; pointer-events:none; z-index:5; opacity:0;
    background:#fff; mix-blend-mode:screen; transition:opacity 0.05s ease-out;
  }

  /* ---------- Minimalist Floating HUD Deck ---------- */
  #hud {
    position:fixed; top:16px; right:16px; width:320px; max-height:calc(100vh - 32px); overflow-y:auto;
    z-index:20; background:rgba(10, 14, 26, 0.75); border:1px solid rgba(56, 189, 248, 0.25);
    border-radius:16px; padding:18px 20px; backdrop-filter:blur(20px);
    box-shadow:0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(56, 189, 248, 0.05);
    user-select:none; transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    scrollbar-width:none;
  }
  #hud::-webkit-scrollbar { display:none; }

  /* PURE FULLSCREEN: EVERYTHING VANISHES COMPLETELY */
  body.pure-fullscreen #hud {
    opacity:0; pointer-events:none; transform:translateY(-20px) scale(0.95);
  }
  body.pure-fullscreen:hover #hud {
    opacity:0.95; pointer-events:auto; transform:translateY(0) scale(1);
  }
  body.pure-fullscreen #status,
  body.pure-fullscreen #spectrum {
    opacity:0 !important; pointer-events:none;
  }

  .hud-header {
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
  }
  .hud-title {
    font-size:13px; font-weight:800; letter-spacing:2px; color:#38bdf8;
    text-shadow:0 0 12px rgba(56, 189, 248, 0.5);
  }
  .hud-badge {
    font-size:10px; font-weight:700; background:linear-gradient(135deg, #a855f7, #ec4899);
    color:#fff; padding:2px 8px; border-radius:10px; letter-spacing:1px;
  }

  .section-label {
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px;
    color:#94a3b8; margin:14px 0 8px; display:flex; justify-content:space-between;
  }

  /* FX Matrix Grid (8 Toggleable Modes) */
  .fx-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px;
  }
  .fx-btn {
    padding:8px 10px; font-size:11px; font-weight:600; border-radius:10px; border:1px solid rgba(255, 255, 255, 0.08);
    background:rgba(255, 255, 255, 0.03); color:#94a3b8; cursor:pointer; text-align:left;
    transition:all 0.2s ease; display:flex; align-items:center; gap:6px;
  }
  .fx-btn:hover { background:rgba(255, 255, 255, 0.08); color:#fff; border-color:rgba(56, 189, 248, 0.4); }
  .fx-btn.active {
    background:linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(56, 189, 248, 0.3));
    border-color:#38bdf8; color:#fff; box-shadow:0 0 14px rgba(56, 189, 248, 0.35);
  }

  .ctrl-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:11.5px; }
  .ctrl-row label { width:80px; color:#94a3b8; flex:0 0 auto; }
  .ctrl-row input[type=range] { flex:1; accent-color:#38bdf8; cursor:pointer; height:4px; }
  .ctrl-row .val { width:32px; text-align:right; color:#38bdf8; font-variant-numeric:tabular-nums; font-family:monospace; font-size:11px; }

  .action-btn {
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; padding:10px 14px; margin:6px 0;
    background:rgba(255, 255, 255, 0.04); color:#e2e8f0;
    border:1px solid rgba(255, 255, 255, 0.12); border-radius:10px; cursor:pointer;
    font-size:12px; font-weight:700; letter-spacing:0.5px; transition:all 0.2s ease;
  }
  .action-btn:hover { background:rgba(255, 255, 255, 0.1); border-color:#38bdf8; box-shadow:0 0 16px rgba(56, 189, 248, 0.3); }
  .action-btn.primary {
    background:linear-gradient(135deg, #0284c7, #2563eb); border:none; color:#fff;
    box-shadow:0 4px 14px rgba(37, 99, 235, 0.4);
  }
  .action-btn.primary:hover { box-shadow:0 6px 20px rgba(56, 189, 248, 0.6); transform:translateY(-1px); }
  .action-btn.demo {
    background:linear-gradient(135deg, #a855f7, #ec4899); border:none; color:#fff;
    box-shadow:0 4px 14px rgba(236, 72, 153, 0.4);
  }
  .action-btn.demo:hover { box-shadow:0 6px 20px rgba(236, 72, 153, 0.6); transform:translateY(-1px); }
  .action-btn.fullscreen-btn {
    background:rgba(168, 85, 247, 0.1); border:1px solid rgba(168, 85, 247, 0.3); color:#c084fc;
  }
  .action-btn.fullscreen-btn:hover { background:rgba(168, 85, 247, 0.25); border-color:#c084fc; }

  .divider { height:1px; background:rgba(255, 255, 255, 0.08); margin:12px 0; }

  #trackInfo { font-size:11px; color:#94a3b8; margin-top:6px; line-height:1.4; min-height:16px; word-break:break-all; }
  #trackInfo b { color:#38bdf8; font-weight:600; }

  #seekWrap { margin:8px 0 4px; }
  #seek { width:100%; accent-color:#38bdf8; cursor:pointer; height:4px; }

  #playbackRow { display:flex; gap:8px; margin-top:6px; align-items:center; }
  #playPause { flex:1; padding:8px 12px; margin:0; }
  #timeDisplay { font-size:11px; color:#38bdf8; font-variant-numeric:tabular-nums; text-align:right; width:76px; font-family:monospace; }

  #playlist {
    max-height:80px; overflow-y:auto; margin-top:8px;
    padding-top:4px; font-size:11px; scrollbar-width:thin;
  }
  .pl-item {
    padding:4px 8px; border-radius:6px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:#94a3b8; transition:background 0.15s, color 0.15s; margin-bottom:2px;
  }
  .pl-item:hover { background:rgba(56, 189, 248, 0.12); color:#fff; }
  .pl-item.active { background:rgba(56, 189, 248, 0.22); color:#38bdf8; font-weight:700; }
  .pl-item .del { float:right; color:#ef4444; opacity:0; transition:opacity 0.15s; }
  .pl-item:hover .del { opacity:1; }

  .shortcut-hint { font-size:10px; color:#64748b; margin-top:8px; text-align:center; letter-spacing:0.5px; }

  /* Drag-and-Drop Overlay */
  #dropOverlay {
    position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:rgba(4, 5, 8, 0.85); backdrop-filter:blur(8px); border:3px dashed rgba(56, 189, 248, 0.6);
    color:#38bdf8; font-size:22px; font-weight:700; letter-spacing:2px; text-shadow:0 0 24px rgba(56, 189, 248, 0.6); pointer-events:none;
  }
  #dropOverlay.show { display:flex; }

  /* Sleek Bottom Spectrum Analyzer */
  #spectrum {
    position:fixed; left:0; right:0; bottom:0; height:48px; z-index:10; display:flex; align-items:flex-end;
    gap:3px; padding:0 12px; pointer-events:none; opacity:0.75; transition:opacity 0.3s ease;
  }
  #spectrum .bar { flex:1; background:linear-gradient(to top, #0284c7, #a855f7, #ec4899); border-radius:2px 2px 0 0; }

  #status {
    position:fixed; left:16px; bottom:14px; z-index:15; font-size:11px; color:#64748b;
    letter-spacing:1px; text-shadow:0 0 8px #000; pointer-events:none; font-family:monospace; transition:opacity 0.3s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fxCanvas"></canvas>
<div id="strobeFlash"></div>

<div id="spectrum"></div>
<div id="status">NEXUS // v5.0 PURE RAVE · Press [F] for Clean Fullscreen</div>

<div id="hud">
  <div class="hud-header">
    <span class="hud-title">◈ NEXUS VISUALIZER</span>
    <span class="hud-badge">v5.0 PURE</span>
  </div>

  <div class="section-label"><span>Rave FX Modes</span><span>Toggle</span></div>
  <div class="fx-grid">
    <button class="fx-btn active" id="fxTunnel">🌊 Tunnel</button>
    <button class="fx-btn" id="fxKaleido">🌀 Kaleido</button>
    <button class="fx-btn active" id="fxRgbSplit">🌈 RGB Split</button>
    <button class="fx-btn" id="fxStrobe">⚡ Strobe</button>
    <button class="fx-btn active" id="fxStorm">🌌 Storm</button>
    <button class="fx-btn" id="fxChaos">🔷 Chaos</button>
    <button class="fx-btn active" id="fxShockwave">💥 Shockwave</button>
    <button class="fx-btn" id="fxFogPulse">🌫️ Fog Pulse</button>
  </div>

  <div class="section-label"><span>Dynamics</span></div>
  <div class="ctrl-row">
    <label>Bass React</label>
    <input type="range" id="bassS" min="0" max="2.5" step="0.05" value="1.2">
    <span class="val" id="bassV">1.20</span>
  </div>
  <div class="ctrl-row">
    <label>Speed</label>
    <input type="range" id="spdS" min="0" max="3" step="0.05" value="1.1">
    <span class="val" id="spdV">1.10</span>
  </div>
  <div class="ctrl-row">
    <label>Glow</label>
    <input type="range" id="glowS" min="0" max="2.5" step="0.05" value="1.3">
    <span class="val" id="glowV">1.30</span>
  </div>

  <div class="divider"></div>

  <button class="action-btn primary" id="loadBtn">🎵 LOAD MUSIC FROM PC</button>
  <button class="action-btn demo" id="demoBeatBtn">⚡ 140 BPM SYNTH BEAT</button>
  <input type="file" id="fileInput" accept="audio/*" multiple style="display:none">

  <div id="seekWrap"><input type="range" id="seek" min="0" max="1000" value="0"></div>
  <div id="playbackRow">
    <button class="action-btn" id="playPause">▶ PLAY</button>
    <span id="timeDisplay">0:00 / 0:00</span>
  </div>

  <div id="playlist"></div>

  <div class="divider"></div>

  <button class="action-btn fullscreen-btn" id="fullBtn">⛶ CLEAN FULLSCREEN (F)</button>

  <div id="trackInfo">Ready. Drop an MP3 or click <b>⚡ 140 BPM SYNTH BEAT</b>.</div>
  <div class="shortcut-hint">Space = Play/Pause · [F] = Clean Fullscreen · [Esc] = Exit</div>
</div>

<div id="dropOverlay">DROP AUDIO FILES ANYWHERE</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  'use strict';

  // ===================== THREE.JS SCENE SETUP =====================
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x040508, 0.012);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 500);
  camera.position.set(0, 2, 16);

  // ---------- Lights ----------
  const lightCyan  = new THREE.PointLight(0x00ffff, 1.5, 70);
  const lightMag   = new THREE.PointLight(0xff00ff, 1.3, 70);
  const lightAmber = new THREE.PointLight(0xffaa00, 1.1, 70);
  const ambient    = new THREE.AmbientLight(0x1a2638, 0.6);
  scene.add(ambient);
  const lightGroup = new THREE.Group();
  lightCyan.position.set(-8, 4, 5);
  lightMag.position.set(8, 2, -4);
  lightAmber.position.set(0, -5, 8);
  lightGroup.add(lightCyan, lightMag, lightAmber);
  scene.add(lightGroup);

  // ---------- Primary Torus Knot ----------
  const knotGeo = new THREE.TorusKnotGeometry(2.4, 0.72, 220, 32, 3, 5);
  const knotMat = new THREE.MeshStandardMaterial({
    color:0x0a0e1a, metalness:0.9, roughness:0.2, emissive:0x0a1a2a, emissiveIntensity:0.6
  });
  const knot = new THREE.Mesh(knotGeo, knotMat);
  scene.add(knot);

  // Wireframe Overlay
  const wireMat = new THREE.MeshBasicMaterial({ color:0x00ffff, wireframe:true, transparent:true, opacity:0.18 });
  const knotWire = new THREE.Mesh(knotGeo.clone(), wireMat);
  scene.add(knotWire);

  // ---------- Secondary Outer Chaos Knot (FX: Chaos) ----------
  const chaosGeo = new THREE.TorusKnotGeometry(3.6, 0.35, 160, 24, 2, 3);
  const chaosMat = new THREE.MeshBasicMaterial({ color:0xff00aa, wireframe:true, transparent:true, opacity:0.0 });
  const chaosKnot = new THREE.Mesh(chaosGeo, chaosMat);
  scene.add(chaosKnot);

  // ---------- 3D Audio Waveform Tunnel (FX: Tunnel) ----------
  const tunnelGroup = new THREE.Group();
  const tunnelRings = [];
  const TUNNEL_SEGMENTS = 36;
  for(let i=0; i<TUNNEL_SEGMENTS; i++){
    const tGeo = new THREE.RingGeometry(5.5, 5.65, 32);
    const tMat = new THREE.MeshBasicMaterial({
      color: 0x00ffff, transparent:true, opacity:0.25, side:THREE.DoubleSide, blending:THREE.AdditiveBlending
    });
    const tMesh = new THREE.Mesh(tGeo, tMat);
    tMesh.position.z = -i * 3.5 + 10;
    tunnelGroup.add(tMesh);
    tunnelRings.push(tMesh);
  }
  scene.add(tunnelGroup);

  // ---------- Expanding Bass Shockwave Rings (FX: Shockwave) ----------
  const shockwaveGroup = new THREE.Group();
  const shockwaves = [];
  for(let i=0; i<4; i++){
    const sGeo = new THREE.RingGeometry(0.1, 0.25, 64);
    const sMat = new THREE.MeshBasicMaterial({
      color: 0x00ffff, transparent:true, opacity:0.0, side:THREE.DoubleSide, blending:THREE.AdditiveBlending
    });
    const sMesh = new THREE.Mesh(sGeo, sMat);
    shockwaveGroup.add(sMesh);
    shockwaves.push({ mesh: sMesh, scale: 0, life: 0, active: false });
  }
  scene.add(shockwaveGroup);

  // ---------- Starfield & Swirling Particle Storm ----------
  const MAX_PARTICLES = 22000;
  const pGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(MAX_PARTICLES*3);
  const colors    = new Float32Array(MAX_PARTICLES*3);
  const speeds    = new Float32Array(MAX_PARTICLES);
  const palette = [new THREE.Color(0x00ffff), new THREE.Color(0xff00ff), new THREE.Color(0xffaa00), new THREE.Color(0x38bdf8), new THREE.Color(0xec4899)];
  for(let i=0; i<MAX_PARTICLES; i++){
    const r = 3.5 + Math.random()*16;
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random()-1);
    positions[i*3]   = r*Math.sin(ph)*Math.cos(th);
    positions[i*3+1] = r*Math.sin(ph)*Math.sin(th)*0.6;
    positions[i*3+2] = r*Math.cos(ph);
    const c = palette[(Math.random()*palette.length)|0];
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
    speeds[i] = 0.2 + Math.random()*1.2;
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  pGeo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  const pMat = new THREE.PointsMaterial({
    size:0.14, vertexColors:true, transparent:true, opacity:0.85,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  const particles = new THREE.Points(pGeo, pMat);
  scene.add(particles);

  // ---------- Concentric Neon Rings ----------
  const ringDefs = [
    { color:0x00ffff, radius:6.5, tube:0.03, tilt:0.2, speed:0.3 },
    { color:0xff00ff, radius:8.2, tube:0.03, tilt:0.5, speed:-0.22 },
    { color:0xffaa00, radius:9.8, tube:0.03, tilt:0.8, speed:0.16 },
    { color:0x38bdf8, radius:11.5, tube:0.03, tilt:1.1, speed:-0.12 }
  ];
  const rings = ringDefs.map(function(d){
    const g = new THREE.Mesh(new THREE.TorusGeometry(d.radius, d.tube, 8, 120),
      new THREE.MeshBasicMaterial({ color:d.color, transparent:true, opacity:0.4, blending:THREE.AdditiveBlending, depthWrite:false }));
    g.rotation.x = d.tilt;
    scene.add(g);
    return { mesh:g, speed:d.speed, baseOpacity:0.4, baseRadius:d.radius };
  });

  // ---------- Ground Grid ----------
  const grid = new THREE.GridHelper(70, 45, 0x00ffff, 0x114466);
  grid.position.y = -6.5;
  grid.material.transparent = true;
  grid.material.opacity = 0.3;
  scene.add(grid);

  // ===================== 2D FX OVERLAY CANVAS =====================
  const fxCanvas = document.getElementById('fxCanvas');
  const fxCtx = fxCanvas.getContext('2d');
  function resizeFxCanvas(){
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }
  resizeFxCanvas();

  // ===================== FX STATES =====================
  const fxState = {
    tunnel: true,
    kaleido: false,
    rgbSplit: true,
    strobe: false,
    storm: true,
    chaos: false,
    shockwave: true,
    fogPulse: false,
  };

  function bindFxButton(btnId, stateKey, onChange){
    const btn = document.getElementById(btnId);
    if(!btn) return;
    btn.onclick = function(){
      fxState[stateKey] = !fxState[stateKey];
      btn.classList.toggle('active', fxState[stateKey]);
      if(onChange) onChange(fxState[stateKey]);
    };
  }

  bindFxButton('fxTunnel', 'tunnel', function(v){ tunnelGroup.visible = v; });
  bindFxButton('fxKaleido', 'kaleido', function(v){ fxCanvas.style.display = (v || fxState.rgbSplit) ? 'block' : 'none'; });
  bindFxButton('fxRgbSplit', 'rgbSplit', function(v){ fxCanvas.style.display = (v || fxState.kaleido) ? 'block' : 'none'; });
  bindFxButton('fxStrobe', 'strobe');
  bindFxButton('fxStorm', 'storm');
  bindFxButton('fxChaos', 'chaos', function(v){ chaosMat.opacity = v ? 0.35 : 0.0; });
  bindFxButton('fxShockwave', 'shockwave');
  bindFxButton('fxFogPulse', 'fogPulse');

  // ===================== AUDIO ENGINE =====================
  let audioCtx = null, analyser = null, isPlaying = false;
  let freqData = null, timeData = null;
  let lastBeatTime = 0;
  const playlist = [];
  let currentIndex = -1;
  let currentBufferSource = null;
  let trackStartTime = 0, trackPausedAt = 0, currentDuration = 0;
  let isDemoBeat = false, synthInterval = null;

  function ensureAudioCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.82;
      freqData = new Uint8Array(analyser.frequencyBinCount);
      timeData = new Uint8Array(analyser.fftSize);
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function buildSpectrumBars(){
    const spec = document.getElementById('spectrum');
    spec.innerHTML = '';
    for(let i=0; i<64; i++){
      const b = document.createElement('div');
      b.className = 'bar';
      b.style.height = '0%';
      spec.appendChild(b);
    }
  }
  buildSpectrumBars();

  function renderPlaylist(){
    const pl = document.getElementById('playlist');
    pl.innerHTML = '';
    playlist.forEach(function(t, i){
      const d = document.createElement('div');
      d.className = 'pl-item' + (i === currentIndex ? ' active' : '');
      const nm = document.createElement('span');
      nm.textContent = (i + 1) + '. ' + t.name;
      nm.style.maxWidth = '210px';
      nm.style.display = 'inline-block';
      nm.style.overflow = 'hidden';
      nm.style.textOverflow = 'ellipsis';
      nm.style.verticalAlign = 'middle';
      d.appendChild(nm);

      const del = document.createElement('span');
      del.className = 'del';
      del.textContent = '✕';
      del.onclick = function(e){
        e.stopPropagation();
        playlist.splice(i, 1);
        if(currentIndex >= i) currentIndex--;
        renderPlaylist();
      };
      d.onclick = function(){ playFromBuffer(i); };
      pl.appendChild(d);
    });
  }

  function stopCurrentAudio(){
    if(currentBufferSource){
      try { currentBufferSource.stop(); } catch(e){}
      currentBufferSource = null;
    }
    if(synthInterval){
      clearInterval(synthInterval);
      synthInterval = null;
    }
    isPlaying = false;
    document.getElementById('playPause').textContent = '▶ PLAY';
  }

  function playFromBuffer(index, offset){
    offset = offset || 0;
    ensureAudioCtx();
    if(index < 0 || index >= playlist.length) return;
    stopCurrentAudio();
    isDemoBeat = false;

    currentIndex = index;
    const track = playlist[index];
    currentDuration = track.buffer.duration;
    trackStartTime = audioCtx.currentTime - offset;
    trackPausedAt = offset;

    currentBufferSource = audioCtx.createBufferSource();
    currentBufferSource.buffer = track.buffer;
    currentBufferSource.connect(analyser);
    analyser.connect(audioCtx.destination);

    currentBufferSource.onended = function(){
      if(isPlaying && audioCtx.currentTime - trackStartTime >= currentDuration - 0.5){
        if(currentIndex + 1 < playlist.length) playFromBuffer(currentIndex + 1);
      }
    };

    currentBufferSource.start(0, offset);
    isPlaying = true;
    document.getElementById('playPause').textContent = '⏸ PAUSE';
    document.getElementById('trackInfo').innerHTML = 'Playing: <b>' + track.name + '</b> (' + formatTime(currentDuration) + ')';
    renderPlaylist();
  }

  // ===================== BUILT-IN 140 BPM RAVE SYNTH =====================
  function playDemoRaveBeat(){
    ensureAudioCtx();
    stopCurrentAudio();
    isDemoBeat = true;
    isPlaying = true;
    document.getElementById('playPause').textContent = '⏸ PAUSE (DEMO)';
    document.getElementById('trackInfo').innerHTML = '⚡ Playing: <b>140 BPM Acid Rave Synth Loop</b> (Live Web Audio)';

    const bpm = 140;
    const stepTime = (60 / bpm) / 4;
    let step = 0;

    synthInterval = setInterval(function(){
      if(!isPlaying) return;
      const t = audioCtx.currentTime;

      // Kick Drum
      if(step % 4 === 0){
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(32, t + 0.12);
        gain.gain.setValueAtTime(1.0, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(gain);
        gain.connect(analyser);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.16);

        triggerShockwave();
      }

      // Snare
      if(step % 8 === 4){
        const noiseBuffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.1), audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1800;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(analyser);
        gain.connect(audioCtx.destination);
        noise.start(t);
        noise.stop(t + 0.13);
      }

      // 303 Bassline
      const notes = [55, 55, 65.4, 55, 82.4, 73.4, 55, 65.4, 55, 110, 55, 82.4, 65.4, 55, 98, 73.4];
      const freq = notes[step % notes.length];
      const acidOsc = audioCtx.createOscillator();
      const acidFilter = audioCtx.createBiquadFilter();
      const acidGain = audioCtx.createGain();

      acidOsc.type = (step % 2 === 0) ? 'sawtooth' : 'square';
      acidOsc.frequency.setValueAtTime(freq, t);

      acidFilter.type = 'lowpass';
      acidFilter.Q.value = 8;
      acidFilter.frequency.setValueAtTime(300, t);
      acidFilter.frequency.exponentialRampToValueAtTime(1800 + Math.sin(step * 0.5) * 1200, t + stepTime * 0.8);

      acidGain.gain.setValueAtTime(0.25, t);
      acidGain.gain.exponentialRampToValueAtTime(0.001, t + stepTime * 0.9);

      acidOsc.connect(acidFilter);
      acidFilter.connect(acidGain);
      acidGain.connect(analyser);
      acidGain.connect(audioCtx.destination);

      acidOsc.start(t);
      acidOsc.stop(t + stepTime);

      step = (step + 1) % 64;
    }, stepTime * 1000);
  }

  function triggerShockwave(){
    if(!fxState.shockwave) return;
    const sw = shockwaves.find(function(s){ return !s.active; }) || shockwaves[0];
    sw.active = true;
    sw.scale = 0.5;
    sw.life = 1.0;
    sw.mesh.scale.set(0.5, 0.5, 0.5);
    sw.mesh.material.opacity = 0.8;
  }

  function loadFile(file){
    ensureAudioCtx();
    const reader = new FileReader();
    reader.onload = function(ev){
      audioCtx.decodeAudioData(ev.target.result, function(buffer){
        playlist.push({ name: file.name, buffer: buffer });
        renderPlaylist();
        if(playlist.length === 1) playFromBuffer(0);
      });
    };
    reader.readAsArrayBuffer(file);
  }

  function formatTime(sec){
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  // ===================== UI LISTENERS =====================
  const loadBtn = document.getElementById('loadBtn');
  const fileInput = document.getElementById('fileInput');
  const demoBeatBtn = document.getElementById('demoBeatBtn');
  const playPause = document.getElementById('playPause');
  const seek = document.getElementById('seek');
  const fullBtn = document.getElementById('fullBtn');

  loadBtn.onclick = function(){ fileInput.click(); };
  fileInput.onchange = function(e){
    Array.from(e.target.files).forEach(loadFile);
  };

  demoBeatBtn.onclick = function(){
    if(isDemoBeat && isPlaying){
      stopCurrentAudio();
    } else {
      playDemoRaveBeat();
    }
  };

  playPause.onclick = function(){
    ensureAudioCtx();
    if(isDemoBeat){
      isPlaying ? stopCurrentAudio() : playDemoRaveBeat();
      return;
    }
    if(!isPlaying && playlist.length > 0){
      playFromBuffer(currentIndex >= 0 ? currentIndex : 0, trackPausedAt);
    } else if(isPlaying){
      trackPausedAt = audioCtx.currentTime - trackStartTime;
      stopCurrentAudio();
    }
  };

  seek.oninput = function(e){
    if(currentDuration > 0 && playlist.length > 0){
      const pos = (e.target.value / 1000) * currentDuration;
      playFromBuffer(currentIndex, pos);
    }
  };

  function toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(function(){});
      document.body.classList.add('pure-fullscreen');
    } else {
      document.exitFullscreen().catch(function(){});
      document.body.classList.remove('pure-fullscreen');
    }
  }

  fullBtn.onclick = toggleFullscreen;

  document.addEventListener('fullscreenchange', function(){
    if(document.fullscreenElement){
      document.body.classList.add('pure-fullscreen');
    } else {
      document.body.classList.remove('pure-fullscreen');
    }
  });

  window.addEventListener('keydown', function(e){
    if(e.code === 'Space'){ e.preventDefault(); playPause.click(); }
    if(e.code === 'KeyF'){ e.preventDefault(); toggleFullscreen(); }
  });

  // Drag & Drop
  const dropOverlay = document.getElementById('dropOverlay');
  window.addEventListener('dragover', function(e){ e.preventDefault(); dropOverlay.classList.add('show'); });
  window.addEventListener('dragleave', function(e){ if(e.relatedTarget === null) dropOverlay.classList.remove('show'); });
  window.addEventListener('drop', function(e){
    e.preventDefault();
    dropOverlay.classList.remove('show');
    Array.from(e.dataTransfer.files).forEach(function(f){
      if(f.type.startsWith('audio/') || f.name.match(/\.(mp3|wav|ogg|flac|m4a|aac)$/i)) loadFile(f);
    });
  });

  // Slider Updates
  const bassS = document.getElementById('bassS');
  const spdS = document.getElementById('spdS');
  const glowS = document.getElementById('glowS');
  bassS.oninput = function(e){ document.getElementById('bassV').textContent = parseFloat(e.target.value).toFixed(2); };
  spdS.oninput = function(e){ document.getElementById('spdV').textContent = parseFloat(e.target.value).toFixed(2); };
  glowS.oninput = function(e){ document.getElementById('glowV').textContent = parseFloat(e.target.value).toFixed(2); };

  // ===================== ANIMATION & RAVE RENDER LOOP =====================
  const clock = new THREE.Clock();
  const strobeEl = document.getElementById('strobeFlash');

  function animate(){
    requestAnimationFrame(animate);

    const delta = clock.getDelta();
    const elapsed = clock.getElapsedTime();
    const speedMult = parseFloat(spdS.value) || 1.0;
    const bassMult = parseFloat(bassS.value) || 1.0;
    const glowMult = parseFloat(glowS.value) || 1.0;

    let bassEnergy = 0, midEnergy = 0, highEnergy = 0;
    if(analyser && isPlaying){
      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(timeData);

      // Bass range
      let bSum = 0;
      for(let i=0; i<8; i++) bSum += freqData[i];
      bassEnergy = (bSum / (8 * 255)) * bassMult;

      // Mid range
      let mSum = 0;
      for(let i=8; i<40; i++) mSum += freqData[i];
      midEnergy = (mSum / (32 * 255));

      // High range
      let hSum = 0;
      for(let i=40; i<120; i++) hSum += freqData[i];
      highEnergy = (hSum / (80 * 255));

      // Spectrum Bars
      const bars = document.getElementById('spectrum').children;
      for(let i=0; i<64; i++){
        const val = freqData[i*2] || 0;
        bars[i].style.height = ((val/255)*100) + '%';
      }

      // Seek Bar & Time Display
      if(!isDemoBeat && currentDuration > 0 && audioCtx){
        const cur = Math.min(currentDuration, audioCtx.currentTime - trackStartTime);
        seek.value = (cur / currentDuration) * 1000;
        document.getElementById('timeDisplay').textContent = formatTime(cur) + ' / ' + formatTime(currentDuration);
      }
    }

    // 1. Torus Knot Dynamics
    const knotScale = 1.0 + bassEnergy * 0.45;
    knot.scale.set(knotScale, knotScale, knotScale);
    knot.rotation.x = elapsed * 0.45 * speedMult;
    knot.rotation.y = elapsed * 0.65 * speedMult;
    knotWire.scale.set(knotScale*1.02, knotScale*1.02, knotScale*1.02);
    knotWire.rotation.x = knot.rotation.x;
    knotWire.rotation.y = knot.rotation.y;

    knotMat.emissiveIntensity = 0.4 + bassEnergy * 1.5 * glowMult;
    knotMat.emissive.setHSL((elapsed * 0.08 + bassEnergy * 0.2) % 1, 0.9, 0.5);
    wireMat.color.setHSL((elapsed * 0.12) % 1, 1.0, 0.6);

    // 2. FX: Chaos Knot
    if(fxState.chaos){
      chaosKnot.rotation.x = -elapsed * 0.8 * speedMult;
      chaosKnot.rotation.z = elapsed * 0.6 * speedMult;
      const cScale = 1.0 + midEnergy * 0.5;
      chaosKnot.scale.set(cScale, cScale, cScale);
      chaosMat.color.setHSL((elapsed * 0.15 + 0.5) % 1, 1.0, 0.5);
    }

    // 3. FX: Waveform Tunnel
    if(fxState.tunnel){
      tunnelRings.forEach(function(ring, idx){
        ring.position.z += 12.0 * delta * speedMult;
        if(ring.position.z > 16) ring.position.z = -TUNNEL_SEGMENTS * 3.5 + 16;
        const waveVal = timeData ? (timeData[(idx * 8) % timeData.length] / 128.0 - 1.0) : 0;
        const rScale = 1.0 + Math.abs(waveVal) * 0.8 * bassMult + bassEnergy * 0.3;
        ring.scale.set(rScale, rScale, rScale);
        ring.material.opacity = 0.15 + (1.0 - Math.abs(ring.position.z) / 100) * 0.35 + bassEnergy * 0.3;
        ring.material.color.setHSL((elapsed * 0.1 + idx * 0.03) % 1, 1.0, 0.5);
      });
    }

    // 4. FX: Shockwave Rings
    if(fxState.shockwave){
      shockwaves.forEach(function(sw){
        if(sw.active){
          sw.scale += 28.0 * delta * speedMult;
          sw.life -= 1.8 * delta;
          sw.mesh.scale.set(sw.scale, sw.scale, sw.scale);
          sw.mesh.material.opacity = Math.max(0, sw.life * 0.8);
          sw.mesh.material.color.setHSL((elapsed * 0.2) % 1, 1.0, 0.6);
          if(sw.life <= 0) sw.active = false;
        }
      });
    }

    // 5. FX: Particle Storm
    const pPos = pGeo.attributes.position.array;
    for(let i=0; i<MAX_PARTICLES; i++){
      const spd = speeds[i] * speedMult * (1.0 + bassEnergy * 1.5);
      pPos[i*3+1] += Math.sin(elapsed * spd + i) * 0.03 * (fxState.storm ? 2.5 : 1.0);
      pPos[i*3]   += Math.cos(elapsed * spd * 0.5 + i) * 0.03;
    }
    pGeo.attributes.position.needsUpdate = true;
    particles.rotation.y = elapsed * 0.15 * speedMult;

    // 6. Neon Rings
    rings.forEach(function(r, idx){
      r.mesh.rotation.z += r.speed * delta * speedMult;
      const rScale = 1.0 + (idx === 0 ? bassEnergy * 0.25 : (idx === 1 ? midEnergy * 0.3 : highEnergy * 0.2));
      r.mesh.scale.set(rScale, rScale, rScale);
      r.mesh.material.opacity = r.baseOpacity + bassEnergy * 0.4;
    });

    // 7. FX: Beat Strobe
    if(fxState.strobe && bassEnergy > 0.85 && elapsed - lastBeatTime > 0.12){
      lastBeatTime = elapsed;
      strobeEl.style.opacity = '0.7';
      setTimeout(function(){ strobeEl.style.opacity = '0'; }, 40);
    }

    // 8. FX: Fog Pulse
    if(fxState.fogPulse){
      scene.fog.density = 0.008 + bassEnergy * 0.018;
      scene.fog.color.setHSL((elapsed * 0.05) % 1, 0.8, 0.05 + bassEnergy * 0.05);
    }

    // Camera Orbit
    camera.position.x = Math.sin(elapsed * 0.25 * speedMult) * 3.5;
    camera.position.y = 2 + Math.cos(elapsed * 0.2 * speedMult) * 1.5;
    camera.lookAt(0, 0, 0);

    // Render WebGL
    renderer.render(scene, camera);

    // 9. Post-FX 2D Overlays (Kaleidoscope & RGB Split)
    if(fxState.kaleido || fxState.rgbSplit){
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

      if(fxState.rgbSplit && bassEnergy > 0.4){
        const offset = Math.floor(bassEnergy * 16);
        fxCtx.globalCompositeOperation = 'screen';
        fxCtx.drawImage(canvas, -offset, 0);
        fxCtx.drawImage(canvas, offset, 0);
        fxCtx.globalCompositeOperation = 'source-over';
      }

      if(fxState.kaleido){
        const cx = fxCanvas.width / 2;
        const cy = fxCanvas.height / 2;
        const slices = 8;
        const stepAngle = (Math.PI * 2) / slices;

        fxCtx.save();
        fxCtx.translate(cx, cy);
        for(let i=0; i<slices; i++){
          fxCtx.rotate(stepAngle);
          fxCtx.drawImage(canvas, -cx/2, -cy/2, cx, cy);
        }
        fxCtx.restore();
      }
    }
  }

  // Handle Window Resize
  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    resizeFxCanvas();
  });

  // Start Animation Loop
  animate();

})();
</script>
</body>
</html>
