<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUCY IN THE FREQUENCIES — 3D Vector Spectrum Visualizer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:#000;
    font-family:'Segoe UI', system-ui, sans-serif;
    color:#fff;
  }
  #stage {
    position:fixed; inset:0;
    display:block;
    background:#000;
    cursor:grab;
    touch-action:none;
  }
  #stage.dragging { cursor:grabbing; }

  /* HUD */
  #hud {
    position:fixed; top:0; left:0; right:0;
    padding:18px 24px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
    z-index:10;
  }
  #title {
    font-family:Georgia, 'Times New Roman', serif;
    font-style:italic;
    font-size:clamp(18px, 3.2vw, 40px);
    letter-spacing:2px;
    color:#fff;
    text-shadow:0 0 18px rgba(255,120,220,.9), 0 0 40px rgba(80,160,255,.8), 2px 2px 0 rgba(0,0,0,.6);
    line-height:1;
  }
  #subtitle {
    margin-top:6px;
    font-size:clamp(9px,1.2vw,13px);
    letter-spacing:4px;
    text-transform:uppercase;
    color:rgba(255,255,255,.6);
    text-shadow:0 0 8px rgba(0,0,0,.8);
  }
  #fps {
    font-size:12px;
    font-variant-numeric:tabular-nums;
    color:rgba(255,255,255,.55);
    text-shadow:0 0 6px rgba(0,0,0,.9);
    text-align:right;
  }
  #fps b { color:#7fe3ff; }

  /* Button bar */
  #bar {
    position:fixed; bottom:0; left:0; right:0;
    padding:14px 16px;
    display:flex; justify-content:center; flex-wrap:wrap; gap:10px;
    z-index:10;
    background:linear-gradient(to top, rgba(0,0,0,.65), transparent);
    pointer-events:none;
  }
  .btn {
    pointer-events:auto;
    background:rgba(20,20,30,.55);
    border:1px solid rgba(255,255,255,.28);
    color:#fff;
    padding:9px 16px;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    border-radius:30px;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:all .18s ease;
    box-shadow:0 0 12px rgba(0,0,0,.5);
    font-weight:600;
  }
  .btn:hover { transform:translateY(-2px); border-color:#fff; background:rgba(60,60,90,.7); }
  .btn.active {
    background:linear-gradient(120deg,#ff5f9e,#7a5cff);
    border-color:#fff;
    box-shadow:0 0 22px rgba(255,95,158,.7);
  }
  #fsbtn { border-color:#7fe3ff; color:#7fe3ff; }
  #fsbtn:hover { background:rgba(127,227,255,.2); }

  #hint {
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
    font-size:12px; letter-spacing:2px; text-transform:uppercase;
    color:rgba(255,255,255,.5); text-shadow:0 0 6px rgba(0,0,0,.8);
    pointer-events:none; text-align:center; white-space:nowrap;
    z-index:10;
  }
  #fsbadge {
    position:fixed; top:14px; right:14px; z-index:20;
    background:rgba(0,0,0,.5); border:1px solid rgba(127,227,255,.6);
    color:#7fe3ff; font-size:10px; letter-spacing:2px; text-transform:uppercase;
    padding:4px 8px; border-radius:4px;
    display:none;
  }
  @media (max-width:600px){
    #hint{ display:none; }
    .btn{ padding:7px 12px; font-size:11px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud">
  <div>
    <div id="title">Lucy in the Frequencies</div>
    <div id="subtitle">3D Vector Spectrum · Web Audio</div>
  </div>
  <div id="fps">FPS <b id="fpsval">0</b> · <span id="mode">CLASSIC</span></div>
</div>

<div id="hint">CLICK to load a track · DRAG to orbit · SCROLL to zoom</div>

<div id="bar">
  <button class="btn active" data-mode="classic">🌊 Classic</button>
  <button class="btn" data-mode="swirl">🌀 Swirl</button>
  <button class="btn" data-mode="volcano">🌋 Volcano</button>
  <button class="btn" data-mode="ring">🎸 Ring</button>
  <button class="btn" data-mode="spiral">✨ Spiral</button>
  <button class="btn" id="fsbtn">⛶ Fullscreen</button>
</div>

<div id="fsbadge">⛶ FULLSCREEN</div>

<script>
(function(){
'use strict';

/* ============================================================
   LUCY IN THE FREQUENCIES — 3D VECTOR SPECTRUM VISUALIZER
   - True 3D vector graphics: all geometry is drawn as projected
     line segments / stroked paths (NOT filled polygons).
   - Custom perspective projection, yaw+pitch orbit camera.
   - Full screen mode via Fullscreen API.
   ============================================================ */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const fpsEl = document.getElementById('fpsval');
const modeEl = document.getElementById('mode');
const fsbtn = document.getElementById('fsbtn');
const fsbadge = document.getElementById('fsbadge');

let W = 0, H = 0, DPR = 1;

/* ---------- Camera ---------- */
const cam = { yaw: 0, pitch: 0.5, dist: 4.6, auto: true };
let targetYaw = 0;
let rotSpeed = 0.35;

/* ---------- Audio ---------- */
let audioCtx = null;
let analyser = null;
let source = null;
let freqData = null;
let playing = false;
let smoothing = 0.82;

const BARS = 72;          // number of frequency bands
const bands = new Float32Array(BARS);
const smoothBands = new Float32Array(BARS);

/* ---------- Pointer / drag state ---------- */
const drag = { on:false, x:0, y:0 };
let lastAuto = Date.now();
let zoom = 1;

/* ---------- Modes ---------- */
let mode = 'classic';
const modeMap = { classic:'CLASSIC', swirl:'SWIRL', volcano:'VOLCANO', ring:'RING', spiral:'SPIRAL' };

/* ============================================================
   RESIZE
   ============================================================ */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
   3D MATH — vector graphics projection
   ============================================================ */
function project(p){
  // p = {x,y,z} in world space
  // rotate by yaw around Y, pitch around X
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const cx = Math.cos(cam.pitch), sx = Math.sin(cam.pitch);

  let x = p.x*cy + p.z*sy;
  let z = -p.x*sy + p.z*cy;
  let y = p.y*cx - z*sx;
  z = p.y*sx + z*cx;

  const fov = 2.2;
  const d = cam.dist * zoom;
  const scale = fov / (d + z);
  if(scale <= 0.0001) return null;

  const sx2 = W/2 + x*scale*W/2;
  const sy2 = H/2 - y*scale*W/2;
  return { x:sx2, y:sy2, scale };
}

/* Draw a 3D line segment as a vector, shaded by depth */
function line3(a, b, colorA, colorB, width){
  const pa = project(a), pb = project(b);
  if(!pa || !pb) return;
  // depth-based alpha
  const da = Math.max(0.15, Math.min(1, 1.15 - pa.scale*0.28));
  const db = Math.max(0.15, Math.min(1, 1.15 - pb.scale*0.28));
  ctx.strokeStyle = colorA;
  ctx.globalAlpha = da;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(pa.x, pa.y);
  ctx.lineTo(pb.x, pb.y);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

/* Draw a 3D polyline (array of points) as connected vectors */
function polyline3(points, colorFn, width){
  for(let i=0;i<points.length-1;i++){
    const ca = colorFn ? colorFn(i) : '#fff';
    const cb = colorFn ? colorFn(i+1) : '#fff';
    line3(points[i], points[i+1], ca, cb, width);
  }
}

/* ============================================================
   COLOR HELPERS
   ============================================================ */
function hsl(h,s,l){ return `hsl(${h|0},${s}%,${l}%)`; }

function bandColor(i, t){
  const hue = ((i/BARS)*360 + t*40) % 360;
  return hsl(hue, 100, 62);
}
function bandColor2(i, t){
  const hue = (180 + (i/BARS)*180 + t*30) % 360;
  return hsl(hue, 95, 60);
}
function ringColor(i, t){
  const hue = ((i/16)*60 + t*20) % 360;
  return hsl(hue, 100, 60);
}

/* ============================================================
   VISUALIZER MODES — all vector graphics
   ============================================================ */
const t = { now: 0 };

function drawClassic(){
  const R = 2.1;
  const points = [];
  for(let i=0;i<BARS;i++){
    const a = (i/BARS)*Math.PI*2;
    const v = smoothBands[i];
    const len = 0.25 + v*1.9;
    const x = Math.cos(a)*R;
    const z = Math.sin(a)*R;
    // bar as a vertical vector segment from base to tip
    line3({x,y:0,z}, {x,y:len,z}, bandColor(i,t.now), bandColor((i+6)%BARS,t.now), 2.2);
  }
  // outer ring vector
  const ring=[];
  for(let i=0;i<=64;i++){
    const a=(i/64)*Math.PI*2;
    ring.push({x:Math.cos(a)*R,y:0,z:Math.sin(a)*R});
  }
  polyline3(ring, i=>ringColor(i,t.now), 1.4);
  // inner ring
  const ring2=[];
  for(let i=0;i<=64;i++){
    const a=(i/64)*Math.PI*2;
    ring2.push({x:Math.cos(a)*0.9,y:0,z:Math.sin(a)*0.9});
  }
  polyline3(ring2, ()=>'rgba(255,255,255,0.5)', 1);
}

function drawSwirl(){
  const R = 2.2;
  const turns = 2.6;
  for(let i=0;i<BARS;i++){
    const a = (i/BARS)*Math.PI*2*turns;
    const v = smoothBands[i];
    const r = 0.4 + (i/BARS)*1.8;
    const len = 0.2 + v*1.7;
    const x = Math.cos(a)*r;
    const z = Math.sin(a)*r;
    line3({x,y:0,z}, {x,y:len,z}, bandColor2(i,t.now), bandColor(i,t.now), 2.0);
  }
  // spiral guides (vector curves)
  const spiral=[];
  for(let i=0;i<=160;i++){
    const a=(i/160)*Math.PI*2*turns;
    const r=0.4+(i/160)*1.8;
    spiral.push({x:Math.cos(a)*r, y:0, z:Math.sin(a)*r});
  }
  polyline3(spiral, i=>hsl((i/160)*360+t.now*30,80,60), 1.2);
}

function drawVolcano(){
  const R = 2.3;
  const base = 0.2 + smoothBands[0]*1.4; // bass drives radius
  for(let i=0;i<BARS;i++){
    const a = (i/BARS)*Math.PI*2;
    const v = smoothBands[i];
    const r = base * (0.6 + (i/BARS)*0.6);
    const len = 0.3 + v*2.4;
    const x = Math.cos(a)*r;
    const z = Math.sin(a)*r;
    line3({x,y:0,z}, {x,y:len,z}, hsl(30+(i/BARS)*40+t.now*10,100,55), hsl(300+(i/BARS)*60,100,60), 2.2);
  }
  // crater ring
  const ring=[];
  for(let i=0;i<=64;i++){
    const a=(i/64)*Math.PI*2;
    ring.push({x:Math.cos(a)*base*0.5,y:0,z:Math.sin(a)*base*0.5});
  }
  polyline3(ring, ()=>'rgba(255,180,60,0.8)', 1.5);
}

function drawRing(){
  const R = 2.2;
  const rings = 3;
  for(let k=0;k<rings;k++){
    const off = (k/rings)*Math.PI*2/3;
    for(let i=0;i<BARS;i++){
      const a = (i/BARS)*Math.PI*2 + off;
      const v = smoothBands[(i + k*24) % BARS];
      const rr = R + Math.sin(a*2 + t.now)*0.25 + v*0.9;
      const x = Math.cos(a)*rr;
      const z = Math.sin(a)*rr;
      const len = 0.2 + v*1.3;
      line3({x,y:0,z}, {x,y:len,z}, ringColor(i+k*10,t.now), hsl(200+k*40,90,60), 1.8);
    }
  }
}

function drawSpiral(){
  const R = 2.4;
  const turns = 3.2;
  const steps = 140;
  for(let i=0;i<steps;i++){
    const a=(i/steps)*Math.PI*2*turns;
    const r = 0.2 + (i/steps)*R;
    const y = (i/steps)*2.2 - 0.6;
    const v = smoothBands[(i*BARS/steps)|0];
    const len = 0.1 + v*0.9;
    const x = Math.cos(a)*r;
    const z = Math.sin(a)*r;
    // draw vertical tick vector
    line3({x,y,z}, {x,y+len,z}, hsl((i/steps)*360+t.now*20,100,60), hsl((i/steps)*360+60+t.now*20,100,65), 2.0);
  }
  // the helix spine
  const spine=[];
  for(let i=0;i<=steps;i++){
    const a=(i/steps)*Math.PI*2*turns;
    const r=0.2+(i/steps)*R;
    const y=(i/steps)*2.2-0.6;
    spine.push({x:Math.cos(a)*r, y, z:Math.sin(a)*r});
  }
  polyline3(spine, i=>hsl((i/steps)*360+t.now*20,90,60), 1.5);
}

/* ============================================================
   BACKGROUND — psychedelic grid floor (vector lines)
   ============================================================ */
function drawBackdrop(){
  const GRID = 4;
  // concentric ring grid on floor (y=0)
  const hueBase = (t.now*0.15)%360;
  for(let g=1; g<=GRID; g++){
    const r = g*(2.9/GRID);
    const ring=[];
    for(let i=0;i<=48;i++){
      const a=(i/48)*Math.PI*2;
      ring.push({x:Math.cos(a)*r, y:0, z:Math.sin(a)*r});
    }
    polyline3(ring, i=>hsl(hueBase + g*25 + (i/48)*20, 70, 22 + g*4), 1.1);
  }
  // radial spokes
  for(let s=0;s<12;s++){
    const a=(s/12)*Math.PI*2;
    line3({x:0,y:0,z:0}, {x:Math.cos(a)*2.9,y:0,z:Math.sin(a)*2.9}, hsl(hueBase+s*12,70,30), hsl(hueBase+s*12+40,70,35), 1);
  }
  // center glowing orb (vector circle)
  const orb=[];
  for(let i=0;i<=32;i++){
    const a=(i/32)*Math.PI*2;
    const r = 0.22 + smoothBands[0]*0.2;
    orb.push({x:Math.cos(a)*r, y:0, z:Math.sin(a)*r});
  }
  polyline3(orb, i=>hsl(hueBase+180,100,70), 2.5);
}

/* ============================================================
   MAIN RENDER LOOP
   ============================================================ */
function render(){
  const now = performance.now()/1000;
  t.now = now;

  ctx.clearRect(0,0,W,H);

  // subtle radial vignette background
  const bg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  bg.addColorStop(0, `hsl(${(now*8)%360},70%,10%)`);
  bg.addColorStop(0.5, `hsl(${(now*8+60)%360},65%,5%)`);
  bg.addColorStop(1, '#000');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  drawBackdrop();

  switch(mode){
    case 'classic': drawClassic(); break;
    case 'swirl':   drawSwirl();   break;
    case 'volcano': drawVolcano(); break;
    case 'ring':    drawRing();    break;
    case 'spiral':  drawSpiral();  break;
  }

  // FPS
  updateFPS();
  requestAnimationFrame(render);
}

/* ============================================================
   AUDIO SETUP
   ============================================================ */
function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = smoothing;
  freqData = new Uint8Array(analyser.frequencyBinCount);
}

function loadFile(file){
  initAudio();
  const url = URL.createObjectURL(file);
  if(source){ try{ source.disconnect(); }catch(e){} }
  const el = new Audio();
  el.crossOrigin='anonymous';
  el.src = url;
  el.loop = true;
  source = audioCtx.createMediaElementSource(el);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  el.play();
  playing = true;
  el.onended = ()=>{ playing=false; };
}

function readBands(){
  if(!analyser) return;
  analyser.getByteFrequencyData(freqData);
  const binStep = Math.floor(freqData.length / BARS);
  for(let i=0;i<BARS;i++){
    let sum=0;
    for(let j=0;j<binStep;j++) sum += freqData[i*binStep+j];
    bands[i] = sum / (binStep*255);
    smoothBands[i] = smoothBands[i]*0.82 + bands[i]*0.18;
  }
}

/* ============================================================
   FULL SCREEN
   ============================================================ */
fsbtn.addEventListener('click', toggleFullscreen);
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().then(()=>{
      fsbadge.style.display='block';
      fsbtn.textContent='⛶ Exit Fullscreen';
      setTimeout(resize, 50);
    }).catch(()=>{});
  } else {
    document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement){
    fsbadge.style.display='none';
    fsbtn.textContent='⛶ Fullscreen';
  }
  setTimeout(resize, 50);
});

/* ============================================================
   INPUT
   ============================================================ */
// Click on canvas to load a track
canvas.addEventListener('click', (e)=>{
  if(drag.on) return;
  const input = document.createElement('input');
  input.type='file';
  input.accept='audio/*';
  input.onchange = ()=> { if(input.files[0]) loadFile(input.files[0]); };
  input.click();
});

// Orbit drag
canvas.addEventListener('pointerdown', (e)=>{
  drag.on=true; drag.x=e.clientX; drag.y=e.clientY;
  cam.auto=false;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e)=>{
  if(!drag.on) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  cam.yaw += dx*0.005;
  cam.pitch += dy*0.004;
  cam.pitch = Math.max(-1.3, Math.min(1.3, cam.pitch));
  drag.x=e.clientX; drag.y=e.clientY;
  lastAuto=Date.now();
});
canvas.addEventListener('pointerup', (e)=>{
  drag.on=false;
  canvas.classList.remove('dragging');
  lastAuto=Date.now();
});

// Zoom
canvas.addEventListener('wheel', (e)=>{
  e.preventDefault();
  zoom *= (e.deltaY>0 ? 1.08 : 0.92);
  zoom = Math.max(0.4, Math.min(2.5, zoom));
},{passive:false});

// Keyboard
window.addEventListener('keydown', (e)=>{
  if(e.key==='f'||e.key==='F') toggleFullscreen();
});

// Mode buttons
document.querySelectorAll('.btn[data-mode]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.btn[data-mode]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    modeEl.textContent = modeMap[mode];
  });
});

/* ============================================================
   FPS
   ============================================================ */
let fpsCount=0, fpsLast=performance.now();
function updateFPS(){
  fpsCount++;
  const now=performance.now();
  if(now-fpsLast>=500){
    fpsEl.textContent = Math.round(fpsCount*1000/(now-fpsLast));
    fpsCount=0; fpsLast=now;
  }
}

/* ============================================================
   AUTO ROTATION + MAIN LOOP
   ============================================================ */
function tick(){
  if(playing) readBands();
  // auto-rotate camera if idle
  if(cam.auto || (Date.now()-lastAuto>3000)){
    cam.auto=true;
    cam.yaw += rotSpeed*0.016;
  }
  render();
}
requestAnimationFrame(function loop(){ tick(); requestAnimationFrame(loop); });

})();
</script>
</body>
</html>
