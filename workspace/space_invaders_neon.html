"use strict";
/* ============================================================
   NEON SPACE INVADERS // BLOOM  — single-file build
   - synthwave magenta/cyan vector wireframe visuals + bloom pass
   - dual-layer parallax starfield + retro sun
   - ricocheting laser beams (boundary + cover bounces)
   - destructible cover blocks (per-cell grid, glow cells)
   - particle spark explosions + shockwave rings
   - 8-bit retro SFX + dynamic engine hum (pitch shifts with
     invader count / speed)
   ============================================================ */

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const hudEl = document.getElementById("hud");
const overlay = document.getElementById("overlay");
const startBtn = document.getElementById("startBtn");

const VW = 900, VH = 720;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
cv.width = VW * DPR; cv.height = VH * DPR;
cv.style.width = VW + "px"; cv.style.height = VH + "px";
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

/* ---------------- Audio: 8-bit synth + hum ---------------- */
let AC = null, master, humOsc, humOsc2, humGain, noiseBuf, muted = false;

function audioInit() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain();
  master.gain.value = muted ? 0 : 0.55;
  master.connect(AC.destination);

  // engine hum: two detuned saws through lowpass, pitch shifts with speed
  humOsc = AC.createOscillator(); humOsc.type = "sawtooth";
  humOsc2 = AC.createOscillator(); humOsc2.type = "sawtooth";
  humOsc2.detune.value = 14;
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 320; lp.Q.value = 0.6;
  humGain = AC.createGain(); humGain.gain.value = 0.0;
  humOsc.connect(lp); humOsc2.connect(lp); lp.connect(humGain); humGain.connect(master);
  humOsc.start(); humOsc2.start();

  // shared noise buffer for explosions
  const len = AC.sampleRate * 0.5;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
}

function blip(f0, f1, dur, type, vol, when) {
  if (!AC) return;
  const t = AC.currentTime + (when || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  g.gain.setValueAtTime(vol || 0.18, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}

function noiseHit(dur, vol) {
  if (!AC) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol || 0.3, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const f = AC.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(2400, t);
  f.frequency.exponentialRampToValueAtTime(120, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t);
}

const SND = {

  playerHit(){ noiseHit(0.55, 0.5); blip(150, 28, 0.5, "sawtooth", 0.26); },
  coverHit() { blip(520, 240, 0.05, "triangle", 0.10); },
  start()   { [523, 659, 784, 1047].forEach((f, i) => blip(f, f, 0.1, "square", 0.14, i * 0.09)); },
  gameOver(){ [660, 494, 392, 261].forEach((f, i) => blip(f, f * 0.96, 0.22, "triangle", 0.18, i * 0.16)); },
  nextWave(){ [392, 523, 659, 784, 1047].forEach((f, i) => blip(f, f, 0.09, "square", 0.13, i * 0.07)); },
  mystery() { blip(1200, 200, 0.5, "square", 0.1); }
};

const lasers = [], foeBullets = [], sparks = [], rings = [], floats = [], debris = [];

  const dx = bx-ax, dy = by-ay, l2 = dx*dx+dy*dy;
  let t = l2 ? ((px-ax)*dx+(py-ay)*dy)/l2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = ax+t*dx, cy = ay+t*dy;
  const ddx = px-cx, ddy = py-cy;
  const d2 = ddx*ddx+ddy*ddy;
