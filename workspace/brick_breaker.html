<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Brick Breaker</title>
    <style>
        canvas { display: block; margin: 0 auto; background: #000; }
        .particle { position: absolute; width: 2px; height: 2px; background: #fff; }
    </style>
</head>
<body>
<canvas id='gameCanvas'></canvas>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Ball properties
    const ballRadius = 10;
    let x = canvas.width / 2;
    let y = canvas.height - 30;
    let dx = 2;
    let dy = -2;

    // Paddle properties
    const paddleHeight = 10;
    const paddleWidth = 75;
    let paddleX = (canvas.width - paddleWidth) / 2;

    let rightPressed = false;
    let leftPressed = false;

    // Brick properties
    const brickRowCount = 5;
    const brickColumnCount = 3;
    const brickWidth = 75;
    const brickHeight = 20;
    const brickPadding = 10;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 30;

    const bricks = [];
    for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
            bricks[c][r] = { x: 0, y: 0, status: 1 };
        }
    }

    // Power-up properties
    const powerUpTypes = ['laser', 'multiball'];
    let powerUps = [];

    // Audio properties
    const soundEffects = {
        brickBreak: new Audio('break.wav'),
        paddleHit: new Audio('paddle_hit.wav'),
        powerUp: new Audio('power_up.wav'),
        laserShot: new Audio('laser_shot.wav')
    };

    // Functions
    function collisionDetection() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                const b = bricks[c][r];
                if (b.status === 1) {
                    if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                        dy = -dy;
                        b.status = 0;
                        soundEffects.brickBreak.play();
                    }
                }
            }
        }
    }

    function drawBall() {
        ctx.beginPath();
        ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#0095DD';
        ctx.fill();
        ctx.closePath();
    }

    function drawPaddle() {
        ctx.beginPath();
        ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
        ctx.fillStyle = '#0095DD';
        ctx.fill();
        ctx.closePath();
    }

    function drawBricks() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                if (bricks[c][r].status === 1) {
                    const brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                    const brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;
                    ctx.beginPath();
                    ctx.rect(brickX, brickY, brickWidth, brickHeight);
                    ctx.fillStyle = '#0095DD';
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }

    function drawPowerUps() {
        powerUps.forEach((powerUp, index) => {
            ctx.beginPath();
            ctx.arc(powerUp.x, powerUp.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = powerUp.type === 'laser' ? '#FF0000' : '#00FF00';
            ctx.fill();
            ctx.closePath();

            // Update power-up position
            powerUp.y += 2;

            // Remove power-up if it goes off-screen
            if (powerUp.y > canvas.height) {
                powerUps.splice(index, 1);
            }
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBricks();
        drawBall();
        drawPaddle();
        drawPowerUps();

        if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
            dx = -dx;
            soundEffects.paddleHit.play();
        }
        if (y + dy < ballRadius) {
            dy = -dy;
            soundEffects.paddleHit.play();
        } else if (y + dy > canvas.height - ballRadius) {
            if (x > paddleX && x < paddleX + paddleWidth) {
                dy = -dy;
                soundEffects.paddleHit.play();
            } else {
                alert('GAME OVER');
                document.location.reload();
            }
        }

        if (rightPressed && paddleX < canvas.width - paddleWidth) {
            paddleX += 7;
        } else if (leftPressed && paddleX > 0) {
            paddleX -= 7;
        }

        x += dx;
        y += dy;

        requestAnimationFrame(draw);
    }

    document.addEventListener('keydown', keyDownHandler, false);
    document.addEventListener('keyup', keyUpHandler, false);

    function keyDownHandler(e) {
        if (e.key === 'Right' || e.key === 'ArrowRight') {
            rightPressed = true;
        } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
            leftPressed = true;
        }
    }

    function keyUpHandler(e) {
        if (e.key === 'Right' || e.key === 'ArrowRight') {
            rightPressed = false;
        } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
            leftPressed = false;
        }
    }

    // Power-up logic
    function addPowerUp(type, x, y) {
        powerUps.push({ type, x, y });
        soundEffects.powerUp.play();
    }

    // Laser logic
    let laserFired = false;
    let laserY = canvas.height - 30;

    function drawLaser() {
        if (laserFired) {
            ctx.beginPath();
            ctx.moveTo(paddleX + paddleWidth / 2, laserY);
            ctx.lineTo(paddleX + paddleWidth / 2, laserY - 10);
            ctx.strokeStyle = '#FF0000';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();
        }
    }

    function fireLaser() {
        laserFired = true;
        laserY = canvas.height - 30;
        soundEffects.laserShot.play();
    }

    function updateLaser() {
        if (laserFired) {
            laserY -= 5;
            if (laserY < 0) {
                laserFired = false;
            }
        }
    }

    // Collision detection for laser
    function checkLaserCollision() {
        if (laserFired) {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1 && laserY < b.y + brickHeight && laserY > b.y) {
                        if (paddleX < b.x + brickWidth && paddleX > b.x) {
                            collisionDetection();
                            laserFired = false;
                        }
                    }
                }
            }
        }
    }

    // Multiball logic
    let multiballCount = 0;

    function createMultiballs() {
        for (let i = 0; i < multiballCount; i++) {
            const newBall = {
                x: canvas.width / 2,
                y: canvas.height - 30,
                dx: Math.random() * 4 - 2,
                dy: -2,
                radius: ballRadius
            };
            balls.push(newBall);
        }
        multiballCount = 0;
    }

    let balls = [{ x, y, dx, dy, radius: ballRadius }];

    // Power-up effects
    function applyPowerUpEffects() {
        powerUps.forEach((powerUp, index) => {
            if (powerUp.y < paddleY + paddleHeight) {
                if (powerUp.type === 'laser') {
                    fireLaser();
                } else if (powerUp.type === 'multiball') {
                    multiballCount = 3;
                    createMultiballs();
                }
                powerUps.splice(index, 1);
            }
        });
    }

    // Handle multiballs
    function updateMultiballs() {
        balls.forEach((ball, index) => {
            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
                soundEffects.paddleHit.play();
            }
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
                soundEffects.paddleHit.play();
            } else if (ball.y + ball.dy > canvas.height - ball.radius) {
                if (ball.x > paddleX && ball.x < paddleX + paddleWidth) {
                    ball.dy = -ball.dy;
                    soundEffects.paddleHit.play();
                } else {
                    balls.splice(index, 1);
                }
            }

            ball.x += ball.dx;
            ball.y += ball.dy;

            // Collision detection for multiballs
            collisionDetection();
        });
    }

    // Event listeners for power-ups
    document.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (mouseY < paddleY + paddleHeight && mouseY > paddleY) {
            if (mouseX > paddleX && mouseX < paddleX + paddleWidth) {
                addPowerUp(powerUpTypes[Math.floor(Math.random() * powerUpTypes.length)], paddleX + paddleWidth / 2, paddleY);
            }
        }
    });

    // Main game loop
    draw();
</script>
</body>
</html>
