<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SPACE INVADERS // BLOOM PROTOCOL</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#05010f;
  overflow:hidden;
  font-family:'Courier New', monospace;
  color:#0ff;
}
#game {
  display:block;
  margin:0 auto;
  background:#05010f;
  cursor:crosshair;
}
#hud {
  position:fixed;
  top:12px; left:12px;
  color:#0ff;
  font-size:14px;
  letter-spacing:2px;
  text-shadow:0 0 8px #0ff, 0 0 20px #f0f;
  z-index:10;
  pointer-events:none;
  line-height:1.8;
}
#hud .label { color:#f0f; }
#overlay {
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(5,1,15,0.85);
  z-index:20;
  text-align:center;
}
#overlay h1 {
  font-size:48px;
  color:#0ff;
  text-shadow:0 0 10px #0ff, 0 0 30px #0ff, 0 0 60px #f0f, 3px 3px 0 #f0f;
  letter-spacing:8px;
  margin-bottom:8px;
}
#overlay h2 {
  font-size:16px;
  color:#f0f;
  text-shadow:0 0 8px #f0f;
  letter-spacing:4px;
  margin-bottom:30px;
}
#overlay p {
  color:#0ff;
  font-size:14px;
  letter-spacing:2px;
  margin:4px 0;
  text-shadow:0 0 6px #0ff;
}
#startBtn {
  margin-top:30px;
  padding:16px 60px;
  font-family:'Courier New', monospace;
  font-size:22px;
  letter-spacing:6px;
  background:transparent;
  color:#0ff;
  border:2px solid #0ff;
  box-shadow:0 0 15px #0ff, inset 0 0 15px rgba(0,255,255,0.3);
  cursor:pointer;
  transition:all 0.3s;
  text-shadow:0 0 8px #0ff;
}
#startBtn:hover {
  background:#0ff;
  color:#05010f;
  box-shadow:0 0 30px #0ff, 0 0 60px #f0f;
  text-shadow:none;
}
.blink { animation:blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div><span class="label">SCORE</span> <span id="scoreVal">000000</span></div>
  <div><span class="label">LEVEL</span> <span id="levelVal">01</span></div>
  <div><span class="label">LIVES</span> <span id="livesVal">3</span></div>
  <div><span class="label">WAVE</span> <span id="waveVal">1</span></div>
</div>
<div id="overlay">
  <h1>NEON INVADERS</h1>
  <h2>// BLOOM PROTOCOL //</h2>
  <p>WAVE 1 // PATROL DRONES</p>
  <p>WAVE 3 // BOSS: TITAN CORE</p>
  <p>WAVE 5 // BOSS: VOID REAPER</p>
  <br>
  <p class="blink">SPACE / CLICK = FIRE</p>
  <p>ARROW KEYS / A D = MOVE</p>
  <button id="startBtn">INITIATE</button>
</div>
