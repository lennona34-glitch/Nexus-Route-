<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TRON LIGHTCYCLE DUEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#00ff88;cursor:none;user-select:none}
#game{display:block;position:absolute;top:0;left:0}
#hud{position:absolute;top:0;left:0;right:0;display:none;justify-content:space-between;padding:12px 18px;font-size:13px;text-shadow:0 0 8px #00ff88;letter-spacing:2px;pointer-events:none;z-index:5}
#hud.show{display:flex}
.hb{display:flex;flex-direction:column;gap:3px}
.hb.center{align-items:center}
.hb.right{align-items:flex-end}
.lbl{font-size:10px;color:#006633;letter-spacing:3px}
.val{font-size:22px;text-shadow:0 0 12px #00ff88,0 0 24px #00ff88}
.cval{color:#aaff66;text-shadow:0 0 12px #aaff66}
.wval{color:#00ccff;text-shadow:0 0 12px #00ccff}
.dash-ok{color:#00ff88}
.dash-no{color:#ff3366;text-shadow:0 0 8px #ff3366}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:10}
.panel{background:rgba(0,8,4,0.94);border:2px solid #00ff88;box-shadow:0 0 40px #00ff88,inset 0 0 30px rgba(0,255,136,0.05);padding:36px 60px;text-align:center;color:#00ff88;letter-spacing:2px;max-width:540px}
.title{font-size:56px;font-weight:bold;text-shadow:0 0 20px #00ff88,0 0 40px #00ff88;margin:0 0 4px;line-height:1}
.sub{font-size:17px;color:#00cc66;margin:0 0 20px;text-shadow:0 0 8px #00cc66}
.info{font-size:12px;color:#007744;margin:8px 0;line-height:1.9}
.k{color:#00ff88;background:rgba(0,255,136,0.08);padding:1px 7px;border-radius:3px;border:1px solid rgba(0,255,136,0.2)}
.blink{animation:blink 1.1s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0.1}}
#crosshair{position:absolute;width:44px;height:44px;pointer-events:none;z-index:20;transform:translate(-50%,-50%)}
#wave-flash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:52px;color:#00ccff;text-shadow:0 0 30px #00ccff;pointer-events:none;z-index:15;opacity:0;letter-spacing:6px;transition:opacity 0.5s,transform 0.5s}
#combo-pop{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:36px;color:#aaff66;text-shadow:0 0 20px #aaff66;pointer-events:none;z-index:15;opacity:0;transition:opacity 0.3s,transform 0.3s}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="hb"><div><span class="lbl">SCORE</span></div><div class="val" id="h-score">0</div><div><span class="lbl">COMBO</span></div><div class="val cval" id="h-combo">x1</div></div>
  <div class="hb center"><div class="val" id="h-dash">DASH READY</div></div>
  <div class="hb right"><div><span class="lbl">WAVE</span></div><div class="val wval" id="h-wave">1</div><div><span class="lbl">GRID</span></div><div class="val" id="h-grid">0%</div></div>
</div>
<svg id="crosshair" viewBox="0 0 44 44">
<circle cx="22" cy="22" r="16" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.85"/>
<circle cx="22" cy="22" r="2.5" fill="#00ff88"/>
<line x1="22" y1="2" x2="22" y2="11" stroke="#00ff88" stroke-width="1.5"/>
<line x1="22" y1="33" x2="22" y2="42" stroke="#00ff88" stroke-width="1.5"/>
<line x1="2" y1="22" x2="11" y2="22" stroke="#00ff88" stroke-width="1.5"/>
<line x1="33" y1="22" x2="42" y2="22" stroke="#00ff88" stroke-width="1.5"/>
<line x1="7" y1="7" x2="13" y2="13" stroke="#00ff88" stroke-width="1" opacity="0.4"/>
<line x1="37" y1="7" x2="31" y2="13" stroke="#00ff88" stroke-width="1" opacity="0.4"/>
<line x1="7" y1="37" x2="13" y2="31" stroke="#00ff88" stroke-width="1" opacity="0.4"/>
<line x1="37" y1="37" x2="31" y2="31" stroke="#00ff88" stroke-width="1" opacity="0.4"/>
</svg>
<div id="wave-flash">WAVE 1</div>
<div id="combo-pop"></div>
<div id="overlay">
  <div class="panel" id="menuPanel">
    <h1 class="title">TRON</h1>
    <div class="sub">LIGHTCYCLE DUEL</div>
    <div class="info">SYSTEM ONLINE &mdash; GRID SYNCHRONIZED</div>
    <div class="info" style="margin-top:16px">
      <span class="k">MOUSE</span> &mdash; AIM CROSSHAIR<br>
      <span class="k">LEFT-CLICK</span> &mdash; FIRE &amp; BOOST<br>
      <span class="k">SPACE</span> &mdash; DASH DODGE<br>
      SURVIVE THE ARENA &mdash; MAXIMIZE COMBO
    </div>
    <div class="info blink" style="margin-top:22px;font-size:16px">&gt; CLICK TO ENTER THE GRID &lt;</div>
  </div>
</div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);initGrid()}
window.addEventListener('resize',resize);
var AC=null,MG=null,eOsc=null,eGain=null,eLFO=null,eLFOG=null,hOsc=null,hGain=null;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=0.38;MG.connect(AC.destination);eOsc=AC.createOscillator();eOsc.type='sawtooth';eOsc.frequency.value=72;eGain=AC.createGain();eGain.gain.value=0;eLFO=AC.createOscillator();eLFO.type='sine';eLFO.frequency.value=7;eLFOG=AC.createGain();eLFOG.gain.value=14;eLFO.connect(eLFOG);eLFOG.connect(eOsc.frequency);eOsc.connect(eGain).connect(MG);eOsc.start();eLFO.start();hOsc=AC.createOscillator();hOsc.type='triangle';hOsc.frequency.value=55;hGain=AC.createGain();hGain.gain.value=0.04;hOsc.connect(hGain).connect(MG);hOsc.start()}catch(e){AC=null}}
function setEngine(n,b){if(!eGain)return;var g=0.05+(n||0.5)*0.12;eGain.gain.setTargetAtTime(b?g*2.4:g,AC.currentTime,0.06);eOsc.frequency.setTargetAtTime(72+(n||0.5)*200+(b?90:0),AC.currentTime,0.04)}
function sfx(t){if(!AC)return;var c=AC.currentTime,g=AC.createGain();g.connect(MG);var o=AC.createOscillator();o.connect(g);if(t==='fire'){o.type='square';o.frequency.setValueAtTime(990,c);o.frequency.exponentialRampToValueAtTime(240,c+0.11);g.gain.setValueAtTime(0.16,c);g.gain.exponentialRampToValueAtTime(0.001,c+0.13);o.start(c);o.stop(c+0.14)}else if(t==='dash'){o.type='sawtooth';o.frequency.setValueAtTime(180,c);o.frequency.exponentialRampToValueAtTime(960,c+0.16);g.gain.setValueAtTime(0.14,c);g.gain.exponentialRampToValueAtTime(0.001,c+0.2);o.start(c);o.stop(c+0.22);var len=Math.floor(AC.sampleRate*0.08);var buf=AC.createBuffer(1,len,AC.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);var ns=AC.createBufferSource();var ng=AC.createGain();ns.buffer=buf;ng.gain.setValueAtTime(0.1,c);ng.gain.exponentialRampToValueAtTime(0.001,c+0.1);ns.connect(ng).connect(MG);ns.start(c);ns.stop(c+0.1)}else if(t==='hit'){o.type='square';o.frequency.setValueAtTime(140,c);o.frequency.exponentialRampToValueAtTime(38,c+0.28);g.gain.setValueAtTime(0.22,c);g.gain.exponentialRampToValueAtTime(0.001,c+0.3);o.start(c);o.stop(c+0.32)}else if(t==='kill'){o.type='sawtooth';o.frequency.setValueAtTime(700,c);o.frequency.exponentialRampToValueAtTime(100,c+0.45);g.gain.setValueAtTime(0.2,c);g.gain.exponentialRampToValueAtTime(0.001,c+0.5);o.start(c);o.stop(c+0.5);setTimeout(function(){if(AC){sfx('fire');sfx('hit')}},55)}else if(t==='combo'){o.type='triangle';var f2=400+Math.random()*300;o.frequency.setValueAtTime(f2,c);o.frequency.linearRampToValueAtTime(f2*2,c+0.1);g.gain.setValueAtTime(0.13,c);g.gain.exponentialRampToValueAtTime(0.001,c+0.2);o.start(c);o.stop(c+0.22)}else if(t==='gameover'){o.type='sawtooth';o.frequency.setValueAtTime(200,c);o.frequency.exponentialRampToValueAtTime(28,c+1.4);g.gain.setValueAtTime(0.22,c);g.gain.exponentialRampToValueAtTime(0.001,c+1.5);o.start(c);o.stop(c+1.5)}else if(t==='wave'){o.type='square';o.frequency.setValueAtTime(330,c);o.frequency.linearRampToValueAtTime(660,c+0.18);o.frequency.linearRampToValueAtTime(990,c+0.36);g.gain.setValueAtTime(0.14,c);g.gain.exponentialRampToValueAtTime(0.001,c+0.5);o.start(c);o.stop(c+0.52)}else if(t==='bh'){o.type='sine';o.frequency.setValueAtTime(600,c);o.frequency.exponentialRampToValueAtTime(150,c+0.06);g.gain.setValueAtTime(0.1,c);g.gain.exponentialRampToValueAtTime(0.001,c+0.07);o.start(c);o.stop(c+0.08)}}
var mx={x:W/2,y:H/2,down:false},keys={},dashUsed=false;
var crosshair=document.getElementById('crosshair');
window.addEventListener('mousemove',function(e){mx.x=e.clientX;mx.y=e.clientY;crosshair.style.left=e.clientX+'px';crosshair.style.top=e.clientY+'px'});
window.addEventListener('mousedown',function(e){if(e.button===0){initAudio();mx.down=true;if(G.phase==='menu'||G.phase==='gameover')startGame()}});
window.addEventListener('mouseup',function(e){if(e.button===0)mx.down=false});
window.addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='Space'){e.preventDefault();if(!dashUsed){dashUsed=true;tryDash()}}if(e.code==='Enter'&&(G.phase==='menu'||G.phase==='gameover'))startGame()});
window.addEventListener('keyup',function(e){keys[e.code]=false;if(e.code==='Space')dashUsed=false});
var grid=null,GW=0,GH=0,CS=28;
function initGrid(){CS=Math.max(18,Math.min(32,Math.floor(Math.max(W,H)/42)));GW=Math.ceil(W/CS);GH=Math.ceil(H/CS);grid=new Uint8Array(GW*GH)}
function gAt(x,y){var c=Math.floor(x/CS),r=Math.floor(y/CS);if(c<0||r<0||c>=GW||r>=GH)return 2;return grid[r*GW+c]}
function gSet(x,y,v){var c=Math.floor(x/CS),r=Math.floor(y/CS);if(c<0||r<0||c>=GW||r>=GH)return;grid[r*GW+c]=v}
function gCov(){var n=0;for(var i=0;i<grid.length;i++)if(grid[i]===1)n++;return n/grid.length}
var G={phase:'menu',time:0,score:0,combo:1,comboT:0,wave:1,best:parseInt(localStorage.getItem('tron_best')||'0',10)};
var P={x:0,y:0,vx:1,vy:0,ang:0,spd:295,bSpd:530,trail:[],dashes:2,md:2,dRech:0,dashing:false,dT:0,dDir:{x:1,y:0},r:7,alive:true,tt:0,st:0};
var enemies=[],bullets=[],parts=[];
var shake={x:0,y:0,m:0};
var lastT=0;
function updHUD(){document.getElementById('h-score').textContent=G.score;document.getElementById('h-combo').textContent='x'+G.combo;document.getElementById('h-wave').textContent=G.wave;document.getElementById('h-grid').textContent=Math.round(gCov()*100)+'%';var de=document.getElementById('h-dash');if(P.dashes>0){de.textContent='DASH READY x'+P.dashes;de.className='val dash-ok'}else{de.textContent='RECHARGING...';de.className='val dash-no'}}
function updCombo(dt){if(G.combo>1){G.comboT-=dt;if(G.comboT<=0)G.combo=1}}
function addCombo(){G.combo=Math.min(G.combo+1,20);G.comboT=4.5;sfx('combo');var cp=document.getElementById('combo-pop');cp.textContent='COMBO x'+G.combo;cp.style.opacity='1';cp.style.transform='translate(-50%,-50%) scale(1.2)';setTimeout(function(){cp.style.opacity='0';cp.style.transform='translate(-50%,-50%) scale(0.8)'},600)}
function sp(x,y,c,n,mns,mxs){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2;var s2=mns+Math.random()*(mxs-mns);parts.push({x:x,y:y,vx:Math.cos(a)*s2,vy:Math.sin(a)*s2,life:0.5+Math.random()*0.5,max:1,c:c,s:2+Math.random()*3})}}
function tryDash(){if(G.phase!=='playing'||!P.alive||P.dashes<=0||P.dashing)return;P.dashes--;P.dashing=true;P.dT=0.2;P.dDir={x:Math.cos(P.ang),y:Math.sin(P.ang)};sfx('dash');for(var i=0;i<22;i++){var a=Math.random()*Math.PI*2;parts.push({x:P.x+(Math.random()-0.5)*8,y:P.y+(Math.random()-0.5)*8,vx:-P.dDir.x*220+Math.cos(a)*50,vy:-P.dDir.y*220+Math.sin(a)*50,life:0.28,max:0.28,c:'#aaffcc',s:2.5})}}
function shoot(){var dx=mx.x-P.x,dy=mx.y-P.y;var m=Math.hypot(dx,dy)||1;var nx=dx/m,ny=dy/m;bullets.push({x:P.x+nx*14,y:P.y+ny*14,vx:nx*760,vy:ny*760,life:1.5,ow:'player',c:'#00ff88'});sfx('fire');for(var i=0;i<7;i++){var a=Math.atan2(ny,nx)+(Math.random()-0.5)*0.7;var s2=180+Math.random()*220;parts.push({x:P.x+nx*14,y:P.y+ny*14,vx:Math.cos(a)*s2,vy:Math.sin(a)*s2,life:0.15,max:0.15,c:'#00ff88',s:2})}}
var ECOLS=['#ff3366','#ffcc00','#00ccff','#ff66ff','#ff8800','#88ff00','#ff00ff'];
function spawnWave(){enemies=[];var cnt=Math.min(2+Math.floor(G.wave*0.8),8);for(var i=0;i<cnt;i++){var sx,sy,tr=0;do{sx=120+Math.random()*(W-240);sy=120+Math.random()*(H-240);tr++}while(tr<30&&Math.hypot(sx-P.x,sy-P.y)<280);var ang=Math.random()*Math.PI*2;var sp3=120+Math.random()*60+G.wave*10;enemies.push({x:sx,y:sy,vx:Math.cos(ang),vy:Math.sin(ang),ang:ang,speed:sp3,bspeed:sp3,trail:[],tt:Math.random()*0.04,tTimer:0,tInt:0.5+Math.random()*0.9,alive:true,c:ECOLS[i%ECOLS.length],r:6,sTimer:1.2+Math.random()*2.5,sInt:Math.max(1,3.5-G.wave*0.2)})}var wf=document.getElementById('wave-flash');wf.textContent='WAVE '+G.wave;wf.style.opacity='1';wf.style.transform='translate(-50%,-50%) scale(1)';setTimeout(function(){wf.style.opacity='0';wf.style.transform='translate(-50%,-50%) scale(1.7)'},800)}
function killEnemy(e){e.alive=false;sfx('kill');addCombo();G.score+=100*G.combo;sp(e.x,e.y,e.c,35,60,320);shake.m=Math.max(shake.m,6)}
function updP(dt){if(!P.alive)return;var dx=mx.x-P.x,dy=mx.y-P.y;var ta=Math.atan2(dy,dx);var df=ta-P.ang;while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;var tr=5.5;if(Math.abs(df)<tr*dt)P.ang=ta;else P.ang+=Math.sign(df)*tr*dt;P.vx=Math.cos(P.ang);P.vy=Math.sin(P.ang);var boost=mx.down;var spd=boost?P.bSpd:P.spd;if(P.dashing){P.dT-=dt;P.x+=P.dDir.x*P.bSpd*2.2*dt;P.y+=P.dDir.y*P.bSpd*2.2*dt;if(P.dT<=0)P.dashing=false}else{P.x+=P.vx*spd*dt;P.y+=P.vy*spd*dt}setEngine(boost?0.9:0.5,boost||P.dashing);if(boost){P.st-=dt;if(P.st<=0){shoot();P.st=0.2}}P.tt-=dt;if(P.tt<=0){P.trail.push({x:P.x,y:P.y});if(P.trail.length>1200)P.trail.shift();gSet(P.x,P.y,1);P.tt=0.022}if(!P.dashing){P.dRech-=dt;if(P.dRech<=0&&P.dashes<P.md){P.dashes++;P.dRech=1.8}}if(gAt(P.x,P.y)===2||(!P.dashing&&gAt(P.x,P.y)===1)){killP();return}for(var i=0;i<enemies.length;i++){var e=enemies[i];if(!e.alive)continue;if(Math.hypot(e.x-P.x,e.y-P.y)<P.r+e.r-2){killP();return}}}
function killP(){if(!P.alive)return;P.alive=false;sfx('hit');shake.m=18;sp(P.x,P.y,'#00ff88',70,100,500);setTimeout(function(){endGame()},1400)}
function updE(dt){var ac=0;for(var i=0;i<enemies.length;i++){var e=enemies[i];if(!e.alive)continue;ac++;e.tt-=dt;if(e.tt<=0){e.trail.push({x:e.x,y:e.y});if(e.trail.length>600)e.trail.shift();gSet(e.x,e.y,1);e.tt=0.028}e.tTimer-=dt;if(e.tTimer<=0){e.tTimer=e.tInt*(0.5+Math.random()*1);var tp=Math.atan2(P.y-e.y,P.x-e.x);e.ang=tp+(Math.random()-0.5)*2.2;e.vx=Math.cos(e.ang);e.vy=Math.sin(e.ang)}var la=60;var lx=e.x+e.vx*la,ly=e.y+e.vy*la;if(gAt(lx,ly)!==0){var tp2=Math.atan2(P.y-e.y,P.x-e.x);e.ang=tp2+(Math.random()<0.5?Math.PI/2:-Math.PI/2)+(Math.random()-0.5)*0.8;e.vx=Math.cos(e.ang);e.vy=Math.sin(e.ang);e.tTimer=0.3}e.x+=e.vx*e.speed*dt;e.y+=e.vy*e.speed*dt;if(gAt(e.x,e.y)===2){killEnemy(e);continue}for(var ti=0;ti<e.trail.length-10;ti++){if(Math.hypot(e.trail[ti].x-e.x,e.trail[ti].y-e.y)<e.r+2){killEnemy(e);break}}if(!e.alive)continue;e.sTimer-=dt;if(e.sTimer<=0){e.sTimer=e.sInt*(0.6+Math.random()*0.8);var ang2=Math.atan2(P.y-e.y,P.x-e.x)+(Math.random()-0.5)*0.25;var s4=320+G.wave*10;bullets.push({x:e.x,y:e.y,vx:Math.cos(ang2)*s4,vy:Math.sin(ang2)*s4,life:2.6,ow:'enemy',c:e.c})}}if(ac===0&&G.phase==='playing'){G.wave++;sfx('wave');spawnWave()}}
function updB(dt){for(var i=bullets.length-1;i>=0;i--){var b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0||gAt(b.x,b.y)===2){if(b.ow==='player'){sp(b.x,b.y,b.c,4,30,100);sfx('bh')}bullets.splice(i,1);continue}if(b.ow==='player'){for(var j=0;j<enemies.length;j++){var e=enemies[j];if(!e.alive)continue;if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+5){killEnemy(e);bullets.splice(i,1);break}}}else{if(P.alive&&!P.dashing&&Math.hypot(P.x-b.x,P.y-b.y)<P.r+5){bullets.splice(i,1);killP()}}}}
function updParts(dt){for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.96;p.vy*=0.96;p.life-=dt;if(p.life<=0)parts.splice(i,1)}}
function startGame(){G.phase='playing';G.score=0;G.combo=1;G.comboT=0;G.wave=1;grid.fill(0);bullets=[];parts=[];P.x=W/2;P.y=H/2;P.vx=1;P.vy=0;P.ang=0;P.trail=[];P.dashes=P.md;P.dRech=0;P.dashing=false;P.alive=true;P.tt=0;P.st=0;enemies=[];spawnWave();document.getElementById('overlay').style.display='none';document.getElementById('hud').className='show'}
function endGame(){G.phase='gameover';if(G.score>G.best){G.best=G.score;localStorage.setItem('tron_best',String(G.best))}sfx('gameover');setTimeout(showGO,300)}
function showGO(){var ov=document.getElementById('overlay');ov.style.display='flex';ov.innerHTML='<div class="panel"><h1 class="title" style="color:#ff3366;text-shadow:0 0 18px #ff3366">DERESOLVED</h1><div class="sub" style="font-size:22px">FINAL SCORE: '+G.score+'</div><div class="sub" style="color:#aaff66;text-shadow:0 0 8px #aaff66">BEST: '+G.best+'</div><div class="sub">WAVE REACHED: '+G.wave+'</div><div class="info blink" style="margin-top:20px;font-size:16px">&gt; CLICK TO RE-ENTER THE GRID &lt;</div></div>'}
</script>
